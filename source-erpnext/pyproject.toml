[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "source-erpnext"
version = "0.1.0"
description = "Airbyte source connector for ERPNext (Frappe REST API)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "airbyte-cdk>=6.0.0",
    "requests>=2.31",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
source-erpnext = "source_erpnext.run:run"

[tool.setuptools.packages.find]
include = ["source_erpnext*"]

[tool.setuptools.package-data]
source_erpnext = ["spec.yaml", "schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["unit_tests"]
