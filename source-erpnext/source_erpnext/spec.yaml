documentationUrl: https://github.com/open-epm/open-epm
connectionSpecification:
  $schema: http://json-schema.org/draft-07/schema#
  title: ERPNext Source Spec
  type: object
  required:
    - host_url
    - api_key
    - api_secret
  properties:
    host_url:
      type: string
      title: ERPNext Host URL
      description: "Base URL of the ERPNext site (e.g. https://erp.mycompany.com). No trailing /api."
      examples:
        - "https://erp.mycompany.com"
      order: 0
    api_key:
      type: string
      title: API Key
      description: "ERPNext API key (User > API Access). Sent as `token <api_key>:<api_secret>`."
      airbyte_secret: true
      order: 1
    api_secret:
      type: string
      title: API Secret
      description: "ERPNext API secret paired with the API key."
      airbyte_secret: true
      order: 2
    page_size:
      type: integer
      title: Page Size
      description: "Number of records per Frappe REST page (limit_page_length). Default 500."
      default: 500
      minimum: 50
      maximum: 5000
      order: 3
