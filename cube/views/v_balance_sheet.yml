views:
  - name: v_balance_sheet
    description: "Balance sheet view for Excel PivotTables"
    cubes:
      - join_path: trial_balance
        includes:
          - data_area_id
          - fiscal_year
          - fiscal_period
          - main_account
          - account_name
          - account_type_name
          - dim_cost_center
          - dim_department
          - period_debit
          - period_credit
          - period_net_amount
    meta:
      sql_filter: "trial_balance.is_balance_sheet = true"
