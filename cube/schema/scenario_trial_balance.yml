cubes:
  - name: scenario_trial_balance
    sql_table: epm_gold.gold_scenario_trial_balance
    data_source: default

    dimensions:
      - name: scenario_id
        sql: scenario_id
        type: string
        title: "Scenario"

      - name: data_area_id
        sql: data_area_id
        type: string
        title: "Legal Entity"

      - name: fiscal_year
        sql: fiscal_year
        type: number
        title: "Fiscal Year"

      - name: fiscal_period
        sql: fiscal_period
        type: number
        title: "Period"

      - name: main_account
        sql: main_account
        type: string
        title: "Account"

      - name: account_name
        sql: account_name
        type: string
        title: "Account Name"

      - name: dim_cost_center
        sql: dim_cost_center
        type: string
        title: "Cost Center"

      - name: dim_department
        sql: dim_department
        type: string
        title: "Department"

    measures:
      - name: amount
        sql: amount
        type: sum
        title: "Amount"

      - name: actual_amount
        sql: "CASE WHEN scenario_id = 'ACTUAL' THEN amount ELSE 0 END"
        type: sum
        title: "Actual"

      - name: budget_amount
        sql: "CASE WHEN scenario_id = 'BUDGET' THEN amount ELSE 0 END"
        type: sum
        title: "Budget"

      - name: variance
        sql: "CASE WHEN scenario_id = 'ACTUAL' THEN amount ELSE 0 END - CASE WHEN scenario_id = 'BUDGET' THEN amount ELSE 0 END"
        type: sum
        title: "Variance"
