cubes:
- name: allocation_results
  sql_table: epm_allocated.alloc_results
  data_source: default
  dimensions:
  - name: scenario_id
    sql: scenario_id
    type: string
    title: Scenario
  - name: allocation_rule_id
    sql: allocation_rule_id
    type: string
    title: Rule
  - name: data_area_id
    sql: data_area_id
    type: string
    title: Legal Entity
  - name: fiscal_year
    sql: fiscal_year
    type: number
    title: Fiscal Year
  - name: fiscal_period
    sql: fiscal_period
    type: number
    title: Period
  - name: source_account
    sql: source_account
    type: string
    title: Source Account
  - name: target_cost_center
    sql: target_cost_center
    type: string
    title: Target Cost Center
  - name: driver_type
    sql: driver_type
    type: string
    title: Driver
  measures:
  - name: pool_amount
    sql: pool_amount
    type: sum
    title: Pool Amount
  - name: allocated_amount
    sql: allocated_amount
    type: sum
    title: Allocated Amount
  - name: driver_weight
    sql: driver_weight
    type: avg
    title: Weight
