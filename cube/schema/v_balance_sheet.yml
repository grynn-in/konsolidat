views:
- name: v_balance_sheet
  description: Balance sheet view for Excel PivotTables
  cubes:
  - join_path: trial_balance
    includes:
    - data_area_id
    - fiscal_year
    - fiscal_period
    - main_account
    - account_name
    - account_type_name
    - dim_cost_center
    - dim_department
    - dim_business_unit
    - period_debit
    - period_credit
    - period_net_amount
    # Queries should include segment: balance_sheet_only to filter
    - balance_sheet_only
