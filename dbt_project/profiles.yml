open_epm:
  # Default target is local dev (plaintext, loopback ClickHouse). Select the
  # `prod` target — `dbt build --target prod`, or set DBT_TARGET=prod — for any
  # networked deployment so traffic and credentials are encrypted.
  #
  # secure/verify are literal YAML booleans (not Jinja-rendered strings) so the
  # dbt-clickhouse adapter receives real bools — a rendered "False" string would
  # be truthy and silently force TLS on. TLS is therefore chosen by target, not
  # by env var.
  target: "{{ env_var('DBT_TARGET', 'dev') }}"
  outputs:
    dev:
      type: clickhouse
      host: "{{ env_var('CLICKHOUSE_HOST', 'localhost') }}"
      port: "{{ env_var('CLICKHOUSE_PORT', '8123') | int }}"
      user: "{{ env_var('CLICKHOUSE_USER', 'default') }}"
      password: "{{ env_var('CLICKHOUSE_PASSWORD', 'open_epm_dev') }}"
      schema: epm
      secure: false
      verify: false
      connect_timeout: 30
      send_receive_timeout: 300
      custom_settings:
        max_memory_usage: 10000000000

    prod:
      type: clickhouse
      host: "{{ env_var('CLICKHOUSE_HOST') }}"
      port: "{{ env_var('CLICKHOUSE_PORT', '8443') | int }}"
      user: "{{ env_var('CLICKHOUSE_USER', 'default') }}"
      password: "{{ env_var('CLICKHOUSE_PASSWORD') }}"
      schema: "{{ env_var('CLICKHOUSE_SCHEMA', 'epm') }}"
      # Encrypted; verify can be relaxed via a separate self-signed-cert target
      # if ever needed, but defaults stay strict here.
      secure: true
      verify: true
      connect_timeout: 30
      send_receive_timeout: 300
      custom_settings:
        max_memory_usage: 10000000000

    # ── Cluster mode (opt-in; requires a live konsol_cluster) ──────────────
    # Usage:
    #   dbt build --target cluster --vars '{"cluster_enabled": true}'
    # or:
    #   export DBT_TARGET=cluster
    #   export CLUSTER_ENABLED=true   # pass via --vars or dbt_project.yml override
    #
    # The `cluster: konsol_cluster` key instructs dbt-clickhouse to add
    # ON CLUSTER konsol_cluster to all CREATE TABLE DDL.
    # Set cluster_enabled=true (via --vars) so the cluster_* macros also
    # switch engines from MergeTree → ReplicatedMergeTree.
    #
    # NEEDS-A-CLUSTER: This target cannot be used without a running multi-node
    # ClickHouse cluster + ClickHouse Keeper.
    # See: docs/admin-guide/cluster-setup.md
    cluster:
      type: clickhouse
      host: "{{ env_var('CLICKHOUSE_HOST') }}"
      port: "{{ env_var('CLICKHOUSE_PORT', '8443') | int }}"
      user: "{{ env_var('CLICKHOUSE_USER', 'default') }}"
      password: "{{ env_var('CLICKHOUSE_PASSWORD') }}"
      schema: "{{ env_var('CLICKHOUSE_SCHEMA', 'epm') }}"
      secure: true
      verify: true
      connect_timeout: 30
      send_receive_timeout: 300
      # Cluster name — must match remote_servers config in ClickHouse XML.
      # dbt-clickhouse appends ON CLUSTER konsol_cluster to CREATE TABLE DDL.
      cluster: konsol_cluster
      custom_settings:
        max_memory_usage: 10000000000
