version: 2

models:
  - name: silver_gl_entries
    description: "Joined GL entries with journal headers, flattened dimensions"
    columns:
      - name: recid
        tests:
          - not_null
      - name: data_area_id
        tests:
          - not_null
      - name: accounting_date
        tests:
          - not_null

  - name: silver_main_accounts
    description: >
      konsol#182: what each account is — the group chart governed in konsol
      (epm_staging.main_accounts, Published leaves), and nothing else. No ERP
      chart is read. An account that is not declared is not here, so its
      trial-balance rows reach neither statement
      (assert_undeclared_accounts_in_trial_balance names them). Empty, with
      every column, when konsol has not created the table yet. The first eleven
      columns are the long-standing contract; the rest are new and stay at the
      end. Group (heading) nodes are left out.
    columns:
      - name: main_account_id
        tests:
          - not_null
          - unique:
              config:
                severity: warn  # identical duplicate rows collapse in the model; disagreeing ones stop the build
      - name: account_type
        description: "The declared account_type: Asset, Liability, Equity, Revenue, Expense, Balance sheet or Profit and loss"
      - name: account_type_name
        description: "The declared account_type (the same value; kept for the contract)"
      - name: is_pnl
        description: "1 when the account is in the P&L (statement_section = 'Profit and Loss')"
      - name: is_balance_sheet
        description: "1 when the account is in the balance sheet (statement_section = 'Balance Sheet')"
      - name: is_equity
        description: "1 when the chart types the account as Equity (account_type = 'Equity') — the same meaning konsol's deal layer uses (konsolidat#213)"
      - name: debit_credit_default
        description: "The declared normal_balance (kept for the contract). No consumer"
      - name: statement_section
        description: "Profit and Loss or Balance Sheet, as declared"
        tests:
          - accepted_values:
              arguments:
                values: ['Profit and Loss', 'Balance Sheet']
              config:
                severity: warn
      - name: sub_section
        description: "Presentation grouping, e.g. Current assets"
      - name: normal_balance
        description: "Debit or Credit, as declared"
      - name: time_balance
        description: "flow (P&L) or balance (balance sheet), as declared"
      - name: fx_method
        description: "The declared translation rate: closing, average or historical. gold_consolidated_trial_balance translates each account at this rate (historical falls back to closing before the first historical tranche); a P&L account may be declared at closing (IAS 29)"
        tests:
          - accepted_values:
              arguments:
                values: ['closing', 'average', 'historical']
              config:
                severity: warn
      - name: is_posting
        description: "1 when entries may be posted to the account"
      - name: parent_account
        description: "The heading node above it in the governed chart"
      - name: allow_ic
        description: "1 when the account may carry intercompany partner rows"
      - name: cf_category
        description: "Operating, Investing or Financing, as declared; inert until konsol#182 PR5b"
      - name: cf_line_item
        description: "Cash-flow line, as declared; inert until konsol#182 PR5b"
      - name: is_cash
        description: "1 for a cash account, as declared; inert until konsol#182 PR5b"
      - name: is_retained_earnings
        description: "konsolidat#199: 1 for the one account the year-end close of a period-end-balance file posts the year's P&L to, as declared in konsol (row K7). 0 for every account while epm_staging.main_accounts predates the column; assert_year_end_close_declared then names the years that cannot close"
      - name: uses_historical_rate
        description: "1 when the chart declares historical-rate translation (fx_method = 'historical'); this is what decides translation, not what the account IS"

  - name: silver_legal_entities
    description: "Clean company master with currency"
    columns:
      - name: data_area
        tests:
          - not_null
          - unique

  - name: silver_entity_currencies
    description: >
      konsol#110: the one answer to which currency an entity keeps its books
      in — konsol's Entity master first, the ERP's company master second.
      Consolidation joins here, so an entity with no connector consolidates.
    columns:
      - name: data_area_id
        tests:
          - not_null
          - unique
      - name: accounting_currency
        description: "Resolved currency; '' when neither source has one"
      - name: currency_source
        description: "'konsol', 'erp', or '' when unresolved"

  - name: silver_fiscal_periods
    description: "Standardized period lookup"

  - name: silver_financial_dimensions
    description: "Clean dimension values with active status"

  - name: silver_exchange_rates
    description: "Cleaned exchange rates — TRUE rates; scaling is resolved once in the source adapter (D365 ConversionFactor, #138) and no later layer may scale"
    columns:
      - name: exchange_rate
        tests:
          - not_null

  - name: silver_budget_entries
    description: "Standardized budget lines joined with register headers"

  - name: silver_trial_balance
    description: "Trial balance from D365 snapshot entity (validation baseline)"

  - name: silver_tb_movements
    description: >
      konsolidat#199: every claimed trial-balance batch normalised to PERIOD
      MOVEMENTS from the basis konsol declared on the claim (amount_basis).
      'Period movement' rows are taken as they are; 'Year-to-date movement'
      rows are differenced against the previous period of the same fiscal
      year; 'Period-end balance' rows are differenced against the previous
      claimed period of any year (the first one is the balance from
      inception). Computed on a spine of the entity's claimed periods x the
      entity's keys, so a key that vanishes from a later file yields minus
      its previous figure. One row per key and period. For an entity-year
      of period-end balances that a later year follows, a synthetic
      post-close period in the year's Closing period (epm_staging.fiscal_periods)
      reverses the P&L keys into the chart's retained-earnings account
      (movement_kind 'year_end_close'), so the next year's first period
      carries activity only; assert_year_end_close_declared names a year
      that needs this (any non-zero P&L balance at its last period, not only a non-zero net result) and lacks a Closing
      period or a single retained-earnings account, and
      assert_year_end_close_carried (warn) names a close whose next file
      does not carry the result in the flagged account. Guarded by
      assert_tb_movements_balance (each entity-period sums to 0) and
      assert_tb_movements_cumulate_to_source (undoing the rewrite gives the
      source figure back). Built for the Trial Balance Submission branch of
      silver_gl_entries to read in place of bronze.
    columns:
      - name: data_area_id
        description: "The entity"
        tests:
          - not_null
      - name: fiscal_year
        description: "Fiscal year of the batch"
      - name: fiscal_period
        description: "Fiscal period of the batch"
      - name: main_account
        description: "The account code as submitted"
      - name: partner_data_area_id
        description: "The intercompany partner entity, '' = none (konsol#159)"
      - name: amount_basis
        description: "The batch's declared basis: 'Period movement', 'Year-to-date movement' or 'Period-end balance'; the period was normalised with this rule"
      - name: batch_id
        description: "The claimed batch that holds this entity-period; '' on a synthetic year-end close row"
      - name: submission_name
        description: "The submission (konsol document) that claimed the batch; 'Year-end close' on a synthetic year-end close row"
      - name: description
        description: "The single distinct description of the source rows at this key, '' when they differ or there is no source row"
      - name: source_net_amount
        description: "sum(debit - credit) of the source rows at this key and period; 0 on a spine row the file did not carry"
      - name: movement_amount
        description: "The period movement per the basis rule; the figure every downstream model reads"
      - name: debit_amount
        description: "greatest(movement_amount, 0)"
      - name: credit_amount
        description: "greatest(-movement_amount, 0)"
      - name: movement_kind
        description: "'activity' for a movement of the file's own; 'year_end_close' for the synthetic close of a period-end-balance year, posted in the Closing period"
        tests:
          - accepted_values:
              values: ['activity', 'year_end_close']
