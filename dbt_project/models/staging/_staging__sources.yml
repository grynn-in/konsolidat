version: 2

sources:
  - name: epm_gold
    schema: epm_gold
    description: "Gold tables the konsol app writes directly (not dbt-materialized)"
    tables:
      - name: budget_monthly_input
        description: >
          Manually-entered monthly budgets synced from Budget Sheets on cycle
          lock (konsol budget_sheet._sync_to_clickhouse). UNIONed into
          gold_spread_budget as an identity spread (grynn-in/konsolidat#94).
      - name: budget_annual_input
        description: >
          Top-down annual budget figures from konsol's Budget Annual Input
          doctype, spread into months by gold_spread_budget. konsolidat#146:
          this was seeds/budget_annual_input.csv, the last seed this repo owned.
      - name: entity_fiscal_calendars
        description: >
          Maps each ERP legal entity (data_area_id) to the fiscal calendar it
          posts against; silver_gl_entries joins on it to resolve
          fiscal_year/period, falling back to 'Fiscal' for an entity with no row.
          Most rows are entities NOT present in the demo (CN01->Fiscal_CN,
          MYMF->Fiscal_MY) whose calendars are not loaded; those are inert and
          deliberately retained as a template for real multi-calendar
          deployments. An entity that HAS GL data must reference a calendar
          present in silver_fiscal_periods — the demo's AMHQ/AMUS/AMDE map to
          'Standard', the one calendar it loads — and
          assert_fiscal_calendar_is_loaded (#77) fails the build if a newly
          activated entity points at an unloaded one. To support more calendars,
          load their period data into the raw/staging fiscal-calendar source.
          konsolidat#146 moved it out of seeds/entity_fiscal_calendars.csv into
          konsol's Entity Fiscal Calendar doctype.
        columns:
          - name: data_area_id
            description: "ERP legal-entity code, as the ledger emits it"
            data_tests:
              - unique
              - not_null
      - name: currencies
        description: >
          ISO 4217 reference (code, name, symbol, minor unit) from konsol's ISO
          Currency doctype. Supplies the currency dimension FX validates against:
          from_currency / to_currency in silver_exchange_rates and entity
          accounting/reporting currencies are bare ISO codes with no other source
          of truth (grynn-in/konsolidat#91). Covers the major reserve / G20 / EU
          currencies plus every currency in the demo FX data.
          konsolidat#146 moved it out of seeds/currencies.csv: a list the
          warehouse validates against belongs in the app. Not Frappe's own
          Currency doctype, which is autonamed on the display name and ships no
          ISO exponent — see the konsol controller.
        columns:
          - name: currency_code
            description: "ISO 4217 alphabetic code (3 letters), e.g. CHF"
            data_tests:
              - unique
              - not_null
          - name: minor_unit
            description: "ISO 4217 minor unit (decimal places); JPY=0, most=2, KWD/BHD/OMR=3"
      - name: scenario_definitions
        description: >
          Scenario metadata from konsol's Scenario doctype. This was
          `ref('scenario_definitions')`, a seed, and seeds materialise into
          epm_gold — the same relation konsol writes, so `dbt seed` and
          `bench migrate` overwrote each other (konsolidat#146). The doctype is
          the source: it carried 17 scenarios where the CSV had 4 with stale
          names.
      - name: spread_profiles
        description: >
          Period weights from konsol's Spread Profile doctype. Same collision:
          the seed and the write-through were one relation. konsol's
          ensure_reference_tables() owns the DDL now.
      - name: consolidation_groups
        description: >
          F2: the consolidation STRUCTURE — who and where, no ownership. This
          was `ref('consolidation_groups')`, a seed, and seeds materialise into
          epm_gold: the CSV and konsol's write-through were the SAME relation,
          so every governed build re-seeded it from a June snapshot and every
          bench migrate overwrote it back. Publishing a Consolidation Group
          triggers a consolidation build, which reverted the publish. The seed
          is deleted; konsol's ensure_reference_tables() owns the DDL.
          konsolidat#198: the root row (data_area_id = '') also carries the
          group's Consolidation Policy and declared deal accounts, which the
          acquisition and disposal journals read; the warehouse never assumes
          an account code. DDL pinned by tests/test_deal_tables_ddl.py.
        columns:
          - name: consolidation_group
            description: "The group (root or sub-group) this row belongs to."
          - name: data_area_id
            description: "The member entity; '' on the group's root row, which carries the policy and accounts."
          - name: entity_name
            description: "Display name of the group or member."
          - name: reporting_currency
            description: "The group's presentation currency; journals post in it."
          - name: ic_difference_account
            description: "konsol#159: account the intercompany difference is posted to."
          - name: ic_difference_tolerance
            description: "konsol#159: intercompany difference below which no line is posted."
          - name: nci_measurement
            description: "'partial' (NCI = share of fair-value net assets) or 'full' (NCI at fair value; goodwill includes the NCI's share)."
          - name: accounting_framework
            description: "'IFRS', 'US GAAP' or 'Local'; restricts the policy choices and labels the journals."
          - name: framework_note
            description: "Free text a 'Local' framework must carry, describing its rules."
          - name: goodwill_treatment
            description: "'Impairment only' (no automatic entry) or 'Amortise' (monthly GWA journal over goodwill_amortisation_years)."
          - name: goodwill_amortisation_years
            description: "Years over which goodwill is amortised when goodwill_treatment is 'Amortise'; 0 otherwise."
          - name: acquisition_costs_treatment
            description: "'Expense' (Dr acquisition_costs_account per cost line) or 'Capitalise' (costs join consideration and raise goodwill)."
          - name: measurement_period
            description: "'Off' or '12 months': whether a submitted Business Combination may be amended and re-posted in the acquisition period."
          - name: bargain_purchase
            description: "'Recognise gain' (Cr bargain_purchase_gain_account) or 'Refuse' (the build stops and names the deal)."
          - name: goodwill_account
            description: "Balance-sheet account debited with goodwill at acquisition, derecognised on disposal."
          - name: fair_value_adjustment_account
            description: "Balance-sheet account debited with the fair-value step-up of the acquired net assets."
          - name: investment_account
            description: "Balance-sheet account credited with the consideration transferred (the parent's investment)."
          - name: nci_account
            description: "Equity account credited with the non-controlling interest when share_acquired_pct < 100."
          - name: bargain_purchase_gain_account
            description: "P&L account credited when consideration is below the share of fair-value net assets (IFRS 3.34)."
          - name: disposal_gain_loss_account
            description: "P&L account that takes the balancing line of a disposal journal."
          - name: disposal_proceeds_account
            description: "Account the group settles deal cash through: debited with disposal proceeds, credited with acquisition costs."
          - name: goodwill_amortisation_expense_account
            description: "P&L account debited by the monthly goodwill amortisation when goodwill_treatment is 'Amortise'."
          - name: acquisition_costs_account
            description: "P&L account debited with acquisition costs when acquisition_costs_treatment is 'Expense'."

  - name: epm_staging
    schema: epm_staging
    description: "Write-back staging tables populated by the FastAPI budget input API and Frappe konsol app"
    freshness:
      warn_after: {count: 72, period: hour}
      error_after: {count: 168, period: hour}
    tables:
      - name: dimension_mappings
        description: >
          F3: the dimension crosswalk, written through from konsol's Dimension
          Mapping doctype (Published rows only). Replaces the CSV seed the app
          used to regenerate into this repo on every save and migrate.
      - name: cash_flow_categories
        description: >
          F3: BS-account -> cash-flow-line mapping from the Cash Flow Category
          doctype (Published rows only). Replaces the regenerated CSV seed.
      - name: reporting_hierarchies
        description: >
          F3: flattened reporting hierarchies from the Reporting Hierarchy
          doctype, computed member-by-member. Replaces the regenerated seed.
      - name: sync_watermark
        description: >
          One row per successfully synced table, stamped by konsol's
          clickhouse.sync_table(). D11 wanted ClickHouse to read Frappe's
          MariaDB directly so metadata could never go stale; that was reversed
          (F4) to avoid making every dbt run a live dependency on the Frappe
          database. This is how the "never stale" guarantee is recovered
          without the coupling — see tests/assert_staging_not_stale.sql.
        loaded_at_field: synced_at
      - name: scenario_definitions
        description: "Scenario metadata created via the API"
        loaded_at_field: updated_at
      - name: consolidation_hierarchy
        description: >
          PRD-8: the flat consolidation tree — parent, level, path. It used to
          carry an effective_ownership_pct column that in fact held the DIRECT
          percentage and never expired; F2 dropped it. Ownership is temporal and
          lives only in ownership_periods.
        loaded_at_field: updated_at
      - name: consolidation_ancestry
        description: >
          F2: the link closure of the consolidation tree — one row per (ancestor
          group, entity, link between them), written by konsol's tree walk.
          gold_entity_ownership multiplies each link's dated percentage to get
          the effective share, which is what makes consolidation multi-level.
          Before F2 the tree was stored and never traversed: a sub-group's
          entities never reached its parent's consolidated result.
      - name: entities
        description: >
          konsol#110: the governed entity registry — one row per konsol Entity,
          groups included, with the functional currency as accounting_currency.
          silver_entity_currencies prefers it over the ERP's company master.
      - name: intercompany_accounts
        description: >
          konsol#159: the intercompany flag on the group chart — one row per
          Published Intercompany Account, with the counterpart account the
          partner books the other side on ('' = the same account). Drives
          gold_ic_reconciliation, gold_ic_eliminations and gold_ic_unmatched.
      - name: main_accounts
        description: >
          konsol#182: the group chart of accounts governed in konsol — one row
          per Published Main Account, groups (heading nodes) included, written
          through on publish. It is silver_main_accounts' only source: an
          account not declared here is in neither statement. Its fx_method
          decides the rate gold_consolidated_trial_balance translates at.
          May be absent on a volume konsol has not upgraded yet;
          governed_chart_relation() then reads as "no chart" (silver empty).
      - name: fiscal_periods
        description: >
          konsolidat#199: the fiscal calendar konsol owns and writes through —
          one row per fiscal year and period, Closing periods included. DDL is
          konsol's _REFERENCE_TABLE_DDL, pinned by tests/test_fiscal_periods_ddl.py.
        columns:
          - name: fiscal_year
            description: "The fiscal year the period belongs to."
          - name: fiscal_period
            description: "The period's number within the fiscal year (a Closing period follows the last Regular one)."
          - name: period_code
            description: "konsol's code for the period, e.g. FY2026-P01."
          - name: period_label
            description: "The period's display name."
          - name: period_type
            description: "'Regular' or 'Closing'; the Closing period is where the year-end close of a period-end-balance file posts."
          - name: start_date
            description: "First calendar day of the period."
          - name: end_date
            description: "Last calendar day of the period."
          - name: quarter
            description: "The fiscal quarter the period falls in, as konsol labels it."
          - name: status
            description: "konsol's period status (Open, Closed, ...); the warehouse does not filter on it."
      - name: business_combinations
        description: >
          konsolidat#198: one row per submitted Business Combination (konsol
          doctype; submit = approval) — an acquisition of control. The header
          carries the deal and konsol's Result figures in group currency.
          gold_business_combination_journal posts the acquisition journal from
          it and its child tables. DDL is konsol's _REFERENCE_TABLE_DDL, pinned
          by tests/test_deal_tables_ddl.py.
        columns:
          - name: name
            description: "The document name, BC-<group>-<entity>-<date>; the journal_id is derived from it."
          - name: consolidation_group
            description: "The acquiring group (its root row holds the policy and accounts)."
          - name: acquired_entity
            description: "The entity whose control was obtained (data_area_id)."
          - name: acquisition_date
            description: "Date control passed; mapped to the fiscal period whose start_date <= date <= end_date."
          - name: share_acquired_pct
            description: "Share of the entity acquired, in percent (100 = wholly owned)."
          - name: consideration_currency
            description: "ISO code the header's consideration is stated in (pre-filled with the group's reporting currency)."
          - name: total_consideration
            description: "Sum of the consideration lines translated to group currency, as konsol computed it."
          - name: net_assets_acquired
            description: "Sum of the acquired balance sheet's book amounts in group currency, as konsol computed it (0 when measured from the TB)."
          - name: fair_value_adjustments
            description: "Sum of the fair-value adjustments in group currency, as konsol computed it."
          - name: goodwill
            description: "konsol's goodwill figure: consideration minus the share of fair-value net assets, when positive."
          - name: bargain_purchase_gain
            description: "konsol's bargain-purchase gain: the excess of the share of fair-value net assets over consideration, when positive."
          - name: nci_at_acquisition
            description: "konsol's NCI at acquisition under the group's nci_measurement policy."
          - name: ownership_period
            description: "The Ownership Period konsol created or linked on submit."
      - name: business_combination_consideration
        description: >
          konsolidat#198: the consideration lines of a Business Combination,
          one per IFRS 3 component, each in its own currency; translated at
          the acquisition period's Closing rate by the journal.
        columns:
          - name: parent
            description: "The Business Combination's name."
          - name: idx
            description: "Line number within the document."
          - name: component
            description: "Cash / Deferred / Contingent / Equity instruments / Previously held interest / Other."
          - name: amount
            description: "Line amount in `currency`."
          - name: currency
            description: "ISO code of the line's amount."
          - name: settlement_date
            description: "When a deferred or contingent component settles (1970-01-01 when none)."
          - name: description
            description: "Free text."
      - name: business_combination_acquired_balances
        description: >
          konsolidat#198: the acquired balance sheet of a Business Combination
          in entity currency, Dr positive / Cr negative, with the fair-value
          step-up per line. Empty when konsol measured the net assets from the
          entity's trial balance instead; the journal then falls back to the
          header's net_assets_acquired or to the TB.
        columns:
          - name: parent
            description: "The Business Combination's name."
          - name: idx
            description: "Line number within the document."
          - name: main_account
            description: "A Published balance-sheet leaf of the group chart."
          - name: book_amount
            description: "Book value at acquisition in entity currency; Dr positive, Cr negative. The table nets to the entity's equity."
          - name: fair_value_adjustment
            description: "Fair-value step-up (+) or step-down (-) on this line, entity currency."
          - name: note
            description: "Free text."
      - name: business_combination_costs
        description: >
          konsolidat#198: acquisition costs of a Business Combination, posted
          per the group's acquisition_costs_treatment (Expense: Dr the costs
          account / Cr the settlement account; Capitalise: they join
          consideration).
        columns:
          - name: parent
            description: "The Business Combination's name."
          - name: idx
            description: "Line number within the document."
          - name: kind
            description: "Legal / Advisory / Due diligence / Other."
          - name: amount
            description: "Cost amount in `currency`."
          - name: currency
            description: "ISO code of the cost's amount."
          - name: description
            description: "Free text."
      - name: business_disposals
        description: >
          konsolidat#198: one row per submitted Business Disposal (konsol
          doctype) — loss of control of an entity. gold_business_disposal_journal
          derecognises the entity's balances, goodwill, FVA and NCI, recycles
          CTA and books the gain or loss from it. On submit konsol closes the
          Ownership Period at disposal_date.
        columns:
          - name: name
            description: "The document name, BD-<group>-<entity>-<date>; the journal_id is derived from it."
          - name: consolidation_group
            description: "The disposing group."
          - name: disposed_entity
            description: "The entity control was lost over (data_area_id)."
          - name: disposal_date
            description: "Date control passed; mapped to the fiscal period whose start_date <= date <= end_date."
          - name: share_disposed_pct
            description: "Share disposed of, in percent."
          - name: retained_interest_pct
            description: "Share retained after the disposal; must be 0 in scope (a retained interest is out of scope)."
          - name: proceeds_currency
            description: "ISO code the header's proceeds are stated in."
          - name: total_proceeds
            description: "Sum of the proceeds lines translated to group currency, as konsol computed it."
          - name: ownership_period
            description: "The Ownership Period konsol closed on submit."
      - name: business_disposal_proceeds
        description: >
          konsolidat#198: the proceeds lines of a Business Disposal, one per
          component, each in its own currency; translated at the disposal
          period's Closing rate by the journal.
        columns:
          - name: parent
            description: "The Business Disposal's name."
          - name: idx
            description: "Line number within the document."
          - name: component
            description: "Cash / Deferred / Contingent / Other."
          - name: amount
            description: "Line amount in `currency`."
          - name: currency
            description: "ISO code of the line's amount."
          - name: settlement_date
            description: "When a deferred or contingent component settles (1970-01-01 when none)."
          - name: description
            description: "Free text."
      - name: historical_equity_rates
        description: "PRD-10: Historical FX rates for equity accounts (IAS 21)"
        loaded_at_field: updated_at
      - name: group_exchange_rates
        description: >
          konsol#103 / konsolidat#93: the group's governed exchange rates. One
          approved Closing and one Average rate per (group reporting currency,
          from-currency, fiscal year, fiscal period), written through from
          konsol's Group Exchange Rate. gold_consolidated_trial_balance
          translates from this and nothing else; the ERP feed only pre-fills
          drafts in konsol. `rate` is the TRUE rate (units of to_currency per
          1 from_currency), published by konsol, the single source of FX
          rates; the warehouse never scales or inverts it.
      - name: ownership_periods
        description: "PRD-9/11/12: Temporal ownership periods with acquisition and disposal fields"
        loaded_at_field: updated_at
      - name: consolidation_adjustments
        description: "PRD-16: Top-side adjustments with workflow status and auto-reversal"
        loaded_at_field: updated_at
      - name: allocation_rules
        description: "PRD-17/18/19: Allocation rules with method, driver formula fields"
        loaded_at_field: updated_at
      - name: allocation_drivers
        description: "PRD-17: Unified allocation driver values by type, cost center, period"
        loaded_at_field: updated_at
      - name: allocation_tiers
        description: "PRD-20: Tiered allocation rate bands with cap/floor"
        loaded_at_field: updated_at
      - name: ic_elimination_rules
        description: "PRD-15: IC elimination rules with unrealized profit support"
        loaded_at_field: updated_at
      - name: ic_balances
        description: "PRD-15: IC sales and inventory balances between entity pairs"
        loaded_at_field: updated_at
      - name: allocation_runs
        description: "PRD-21: Allocation run metadata for traceability and reversal"
        loaded_at_field: updated_at
