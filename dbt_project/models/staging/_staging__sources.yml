version: 2

sources:
  - name: epm_gold
    schema: epm_gold
    description: "Gold tables the konsol app writes directly (not dbt-materialized)"
    tables:
      - name: budget_monthly_input
        description: >
          Manually-entered monthly budgets synced from Budget Sheets on cycle
          lock (konsol budget_sheet._sync_to_clickhouse). UNIONed into
          gold_spread_budget as an identity spread (grynn-in/konsolidat#94).
      - name: budget_annual_input
        description: >
          Top-down annual budget figures from konsol's Budget Annual Input
          doctype, spread into months by gold_spread_budget. konsolidat#146:
          this was seeds/budget_annual_input.csv, the last seed this repo owned.
      - name: entity_fiscal_calendars
        description: >
          Maps each ERP legal entity (data_area_id) to the fiscal calendar it
          posts against; silver_gl_entries joins on it to resolve
          fiscal_year/period, falling back to 'Fiscal' for an entity with no row.
          Most rows are entities NOT present in the demo (CN01->Fiscal_CN,
          MYMF->Fiscal_MY) whose calendars are not loaded; those are inert and
          deliberately retained as a template for real multi-calendar
          deployments. An entity that HAS GL data must reference a calendar
          present in silver_fiscal_periods — the demo's AMHQ/AMUS/AMDE map to
          'Standard', the one calendar it loads — and
          assert_fiscal_calendar_is_loaded (#77) fails the build if a newly
          activated entity points at an unloaded one. To support more calendars,
          load their period data into the raw/staging fiscal-calendar source.
          konsolidat#146 moved it out of seeds/entity_fiscal_calendars.csv into
          konsol's Entity Fiscal Calendar doctype.
        columns:
          - name: data_area_id
            description: "ERP legal-entity code, as the ledger emits it"
            data_tests:
              - unique
              - not_null
      - name: currencies
        description: >
          ISO 4217 reference (code, name, symbol, minor unit) from konsol's ISO
          Currency doctype. Supplies the currency dimension FX validates against:
          from_currency / to_currency in silver_exchange_rates and entity
          accounting/reporting currencies are bare ISO codes with no other source
          of truth (grynn-in/konsolidat#91). Covers the major reserve / G20 / EU
          currencies plus every currency in the demo FX data.
          konsolidat#146 moved it out of seeds/currencies.csv: a list the
          warehouse validates against belongs in the app. Not Frappe's own
          Currency doctype, which is autonamed on the display name and ships no
          ISO exponent — see the konsol controller.
        columns:
          - name: currency_code
            description: "ISO 4217 alphabetic code (3 letters), e.g. CHF"
            data_tests:
              - unique
              - not_null
          - name: minor_unit
            description: "ISO 4217 minor unit (decimal places); JPY=0, most=2, KWD/BHD/OMR=3"
      - name: scenario_definitions
        description: >
          Scenario metadata from konsol's Scenario doctype. This was
          `ref('scenario_definitions')`, a seed, and seeds materialise into
          epm_gold — the same relation konsol writes, so `dbt seed` and
          `bench migrate` overwrote each other (konsolidat#146). The doctype is
          the source: it carried 17 scenarios where the CSV had 4 with stale
          names.
      - name: spread_profiles
        description: >
          Period weights from konsol's Spread Profile doctype. Same collision:
          the seed and the write-through were one relation. konsol's
          ensure_reference_tables() owns the DDL now.
      - name: consolidation_groups
        description: >
          F2: the consolidation STRUCTURE — who and where, no ownership. This
          was `ref('consolidation_groups')`, a seed, and seeds materialise into
          epm_gold: the CSV and konsol's write-through were the SAME relation,
          so every governed build re-seeded it from a June snapshot and every
          bench migrate overwrote it back. Publishing a Consolidation Group
          triggers a consolidation build, which reverted the publish. The seed
          is deleted; konsol's ensure_reference_tables() owns the DDL.

  - name: epm_staging
    schema: epm_staging
    description: "Write-back staging tables populated by the FastAPI budget input API and Frappe konsol app"
    freshness:
      warn_after: {count: 72, period: hour}
      error_after: {count: 168, period: hour}
    tables:
      - name: dimension_mappings
        description: >
          F3: the dimension crosswalk, written through from konsol's Dimension
          Mapping doctype (Published rows only). Replaces the CSV seed the app
          used to regenerate into this repo on every save and migrate.
      - name: cash_flow_categories
        description: >
          F3: BS-account -> cash-flow-line mapping from the Cash Flow Category
          doctype (Published rows only). Replaces the regenerated CSV seed.
      - name: reporting_hierarchies
        description: >
          F3: flattened reporting hierarchies from the Reporting Hierarchy
          doctype, computed member-by-member. Replaces the regenerated seed.
      - name: sync_watermark
        description: >
          One row per successfully synced table, stamped by konsol's
          clickhouse.sync_table(). D11 wanted ClickHouse to read Frappe's
          MariaDB directly so metadata could never go stale; that was reversed
          (F4) to avoid making every dbt run a live dependency on the Frappe
          database. This is how the "never stale" guarantee is recovered
          without the coupling — see tests/assert_staging_not_stale.sql.
        loaded_at_field: synced_at
      - name: scenario_definitions
        description: "Scenario metadata created via the API"
        loaded_at_field: updated_at
      - name: consolidation_hierarchy
        description: >
          PRD-8: the flat consolidation tree — parent, level, path. It used to
          carry an effective_ownership_pct column that in fact held the DIRECT
          percentage and never expired; F2 dropped it. Ownership is temporal and
          lives only in ownership_periods.
        loaded_at_field: updated_at
      - name: consolidation_ancestry
        description: >
          F2: the link closure of the consolidation tree — one row per (ancestor
          group, entity, link between them), written by konsol's tree walk.
          gold_entity_ownership multiplies each link's dated percentage to get
          the effective share, which is what makes consolidation multi-level.
          Before F2 the tree was stored and never traversed: a sub-group's
          entities never reached its parent's consolidated result.
      - name: entities
        description: >
          konsol#110: the governed entity registry — one row per konsol Entity,
          groups included, with the functional currency as accounting_currency.
          silver_entity_currencies prefers it over the ERP's company master.
      - name: intercompany_accounts
        description: >
          konsol#159: the intercompany flag on the group chart — one row per
          Published Intercompany Account, with the counterpart account the
          partner books the other side on ('' = the same account). Drives
          gold_ic_reconciliation, gold_ic_eliminations and gold_ic_unmatched.
      - name: historical_equity_rates
        description: "PRD-10: Historical FX rates for equity accounts (IAS 21)"
        loaded_at_field: updated_at
      - name: ownership_periods
        description: "PRD-9/11/12: Temporal ownership periods with acquisition and disposal fields"
        loaded_at_field: updated_at
      - name: consolidation_adjustments
        description: "PRD-16: Top-side adjustments with workflow status and auto-reversal"
        loaded_at_field: updated_at
      - name: allocation_rules
        description: "PRD-17/18/19: Allocation rules with method, driver formula fields"
        loaded_at_field: updated_at
      - name: allocation_drivers
        description: "PRD-17: Unified allocation driver values by type, cost center, period"
        loaded_at_field: updated_at
      - name: allocation_tiers
        description: "PRD-20: Tiered allocation rate bands with cap/floor"
        loaded_at_field: updated_at
      - name: ic_elimination_rules
        description: "PRD-15: IC elimination rules with unrealized profit support"
        loaded_at_field: updated_at
      - name: ic_balances
        description: "PRD-15: IC sales and inventory balances between entity pairs"
        loaded_at_field: updated_at
      - name: allocation_runs
        description: "PRD-21: Allocation run metadata for traceability and reversal"
        loaded_at_field: updated_at
