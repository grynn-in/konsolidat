version: 2

sources:
  - name: epm_staging
    schema: epm_staging
    description: "Write-back staging tables populated by the FastAPI budget input API and Frappe konsol app"
    freshness:
      warn_after: {count: 72, period: hour}
      error_after: {count: 168, period: hour}
    tables:
      - name: budget_input
        description: "Budget/forecast line items submitted via the API"
        loaded_at_field: updated_at
      - name: scenario_definitions
        description: "Scenario metadata created via the API"
        loaded_at_field: updated_at
      - name: consolidation_hierarchy
        description: "PRD-8: Multi-level consolidation group hierarchy with effective ownership"
        loaded_at_field: updated_at
      - name: historical_equity_rates
        description: "PRD-10: Historical FX rates for equity accounts (IAS 21)"
        loaded_at_field: updated_at
      - name: ownership_periods
        description: "PRD-9/11/12: Temporal ownership periods with acquisition and disposal fields"
        loaded_at_field: updated_at
      - name: consolidation_adjustments
        description: "PRD-16: Top-side adjustments with workflow status and auto-reversal"
        loaded_at_field: updated_at
      - name: allocation_rules
        description: "PRD-17/18/19: Allocation rules with method, driver formula fields"
        loaded_at_field: updated_at
      - name: allocation_drivers
        description: "PRD-17: Unified allocation driver values by type, cost center, period"
        loaded_at_field: updated_at
      - name: allocation_tiers
        description: "PRD-20: Tiered allocation rate bands with cap/floor"
        loaded_at_field: updated_at
      - name: ic_elimination_rules
        description: "PRD-15: IC elimination rules with unrealized profit support"
        loaded_at_field: updated_at
      - name: ic_balances
        description: "PRD-15: IC sales and inventory balances between entity pairs"
        loaded_at_field: updated_at
      - name: allocation_runs
        description: "PRD-21: Allocation run metadata for traceability and reversal"
        loaded_at_field: updated_at

  - name: d365_raw
    description: "Raw D365 F&O OData entities landed by Airbyte connector"
    database: epm_raw
    schema: ""
    tables:
      - name: GeneralJournalAccountEntryBiEntities
        identifier: GeneralJournalAccountEntryBiEntities
        description: "GL account entry lines from D365 GeneralJournalAccountEntryBiEntities"
        loaded_at_field: _airbyte_extracted_at
        freshness:
          warn_after: {count: 24, period: hour}
          error_after: {count: 48, period: hour}

      - name: GeneralJournalEntryBiEntities
        identifier: GeneralJournalEntryBiEntities
        description: "GL journal entry headers from D365 GeneralJournalEntryBiEntities"
        loaded_at_field: _airbyte_extracted_at
        freshness:
          warn_after: {count: 24, period: hour}
          error_after: {count: 48, period: hour}

      - name: MainAccounts
        identifier: MainAccounts
        description: "Chart of accounts from D365 MainAccounts"
        loaded_at_field: _airbyte_extracted_at

      - name: MainAccountCategories
        identifier: MainAccountCategories
        description: "Account categories from D365 MainAccountCategories"
        loaded_at_field: _airbyte_extracted_at

      - name: LegalEntities
        identifier: LegalEntities
        description: "Legal entity master from D365 LegalEntities"
        loaded_at_field: _airbyte_extracted_at

      - name: Ledgers
        identifier: Ledgers
        description: "Ledger configuration from D365 Ledgers"
        loaded_at_field: _airbyte_extracted_at

      - name: FiscalCalendarYears
        identifier: FiscalCalendarYears
        description: "Fiscal calendar years from D365 FiscalCalendarYears"
        loaded_at_field: _airbyte_extracted_at

      - name: DimensionAttributes
        identifier: DimensionAttributes
        description: "Financial dimension definitions from D365 DimensionAttributes"
        loaded_at_field: _airbyte_extracted_at

      - name: FinancialDimensionValues
        identifier: FinancialDimensionValues
        description: "Dimension values from D365 FinancialDimensionValues"
