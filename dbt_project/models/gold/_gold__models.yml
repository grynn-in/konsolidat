version: 2

models:
  - name: gold_trial_balance
    description: "Period-level trial balance aggregated from GL entries"
    columns:
      - name: data_area_id
        description: "Legal entity identifier"
        tests:
          - not_null
      - name: fiscal_year
        description: "Fiscal year"
        tests:
          - not_null
      - name: fiscal_period
        description: "Fiscal period (1-12)"
        tests:
          - not_null
      - name: main_account
        description: "Main account ID from chart of accounts"
        tests:
          - not_null

  - name: gold_pnl_by_period
    description: "P&L view - revenue and expense accounts only"
    columns:
      - name: data_area_id
        tests:
          - not_null
      - name: main_account
        tests:
          - not_null

  - name: gold_balance_sheet
    description: "Balance sheet view - cumulative balances for BS accounts"
    columns:
      - name: data_area_id
        tests:
          - not_null
      - name: main_account
        tests:
          - not_null
      - name: cumulative_balance
        description: "Running sum of period_net_amount within the year"

  - name: gold_allocation_results
    description: "Deprecated view over epm_allocated.alloc_results (scenario_id=ACTUAL)"
    columns:
      - name: allocation_rule_id
        tests:
          - not_null
      - name: allocated_amount
        description: "Amount allocated to each target cost center"

  - name: gold_consolidated_trial_balance
    description: "Multi-company consolidated trial balance with currency translation"
    columns:
      - name: consolidation_group
        tests:
          - not_null
      - name: data_area_id
        tests:
          - not_null
      - name: translated_amount
        description: "local_amount * translation_rate"
      - name: group_amount
        description: "translated_amount * ownership_pct"
      - name: nci_amount
        description: "translated_amount * (1 - ownership_pct)"

  - name: gold_ic_eliminations
    description: >
      Intercompany elimination entries, each with a debit and a credit leg that
      net to zero. Balance rows come from gold_ic_reconciliation (konsolidat#148):
      the matched amount of each pair, and the difference moved to the group's
      intercompany-difference account. Unrealized-profit rows come from IC
      Elimination Rules.
    columns:
      - name: rule_id
        tests:
          - not_null
      - name: elimination_amount
        description: "The amount of the entry: a pair's matched amount, a side's difference, or the unrealized profit"
      - name: elimination_kind
        description: "matched, difference or unrealized_profit"
        tests:
          - accepted_values:
              arguments:
                values: ['matched', 'difference', 'unrealized_profit']
      - name: debit_entity
        description: "The entity on the debit side of the eliminated pair."
      - name: credit_entity
        description: "The entity on the credit side of the eliminated pair."
      - name: entity_a
        description: "The pair a balance row belongs to: entity_a/account_a <> entity_b/account_b ('' for unrealized profit)"

  - name: gold_fx_revaluation
    description: "Currency translation adjustment (CTA) entries"
    columns:
      - name: consolidation_group
        tests:
          - not_null
      - name: cta_amount
        description: "PnL CTA component: sum(local * (closing - average) * ownership)"

  - name: gold_scenario_versions
    description: "Scenario version metadata from seed and API"
    columns:
      - name: scenario_id
        tests:
          - not_null

  - name: gold_scenario_trial_balance
    description: "Union of actual + budget + forecast across all scenarios"
    columns:
      - name: scenario_id
        tests:
          - not_null
      - name: data_area_id
        tests:
          - not_null
      - name: amount
        description: "Period amount for the scenario"

  - name: gold_consolidation_adjustments
    description: "Top-side journal adjustments for consolidation"
    columns:
      - name: consolidation_group
        tests:
          - not_null
      - name: journal_id
        tests:
          - not_null
      - name: net_amount
        description: "debit_amount - credit_amount"

  - name: gold_fully_consolidated_tb
    description: "Unified consolidated TB: entity balances + IC elims + CTA + topside"
    columns:
      - name: consolidation_group
        tests:
          - not_null
      - name: adjustment_type
        description: "Layer: entity, ic_elimination, cta, or topside adjustment type"
        tests:
          - not_null

  - name: gold_variance_analysis
    description: "Actual vs budget variance with favorable/unfavorable logic"
    columns:
      - name: main_account
        tests:
          - not_null
      - name: variance_abs
        description: "actual_amount - budget_amount"
      - name: variance_pct
        description: "Variance as percentage of budget"
      - name: variance_favorable
        description: "True if variance is favorable (revenue up or expense down)"

  - name: gold_spread_budget
    description: "Canonical monthly budget fact: annual spread + manual monthly, one row per budget layer (base/challenge/management/board). The final budget is the sum of layers."
    columns:
      - name: scenario_id
        tests:
          - not_null
      - name: layer
        description: "Budget layer: base / challenge / management / board"
      - name: period_amount
        description: "annual_amount * period_weight"

  - name: gold_allocation_tb
    description: "Allocation movements re-grained to trial-balance shape (scenario_key 'allocated'), so K.EPM can read the allocation layer separately from actuals. Each allocation posts two signed legs: target (+) and source (-)."
    columns:
      - name: scenario_id
        tests:
          - not_null
      - name: main_account
        tests:
          - not_null
      - name: period_net_amount
        description: "Signed allocated amount: + on the target leg, - on the source leg"

  # --- New models (Phase 3) ---

  - name: gold_period_hierarchy
    description: "Period dimension mapping fiscal_period to quarter and half labels"
    columns:
      - name: fiscal_period
        tests:
          - not_null
          - unique
      - name: fiscal_quarter
        description: "Quarter label (Q1-Q4)"
      - name: fiscal_half
        description: "Half-year label (H1-H2)"

  - name: gold_ytd_trial_balance
    description: "Year-to-date running totals over gold_trial_balance"
    columns:
      - name: data_area_id
        tests:
          - not_null
      - name: ytd_net_amount
        description: "Cumulative sum of period_net_amount through fiscal_period"

  - name: gold_pnl_quarterly
    description: "Quarterly P&L aggregation for P&L accounts"
    columns:
      - name: fiscal_quarter
        tests:
          - not_null
      - name: quarter_net_amount
        description: "Sum of period_net_amount for the quarter"

  - name: gold_pnl_half_yearly
    description: "Half-yearly P&L aggregation for P&L accounts"
    columns:
      - name: fiscal_half
        tests:
          - not_null
      - name: half_net_amount
        description: "Sum of period_net_amount for the half"

  - name: gold_variance_ytd
    description: "YTD variance: actual vs budget with running totals"
    columns:
      - name: main_account
        tests:
          - not_null
      - name: ytd_actual
        description: "Year-to-date actual amount"
      - name: ytd_budget
        description: "Year-to-date budget amount"

  - name: gold_variance_quarterly
    description: "Quarterly variance: actual vs budget aggregated by quarter"
    columns:
      - name: fiscal_quarter
        tests:
          - not_null

  - name: gold_prior_year_comparison
    description: "Current vs prior year comparison with YoY variance"
    columns:
      - name: main_account
        tests:
          - not_null
      - name: current_amount
        description: "Current year period amount"
      - name: prior_year_amount
        description: "Same period prior year amount"
      - name: yoy_variance_abs
        description: "current_amount - prior_year_amount"

  - name: gold_bs_movement
    description: "Balance sheet movement schedule: opening, movement, closing"
    columns:
      - name: main_account
        tests:
          - not_null
          # Phase 6.1 AC#6: every BS account must be categorized in the seed
          # (no uncategorized accounts leak into the cash flow statement).
          - relationships:
              to: source('epm_staging', 'cash_flow_categories')
              field: main_account
      - name: opening_balance
        description: "Cumulative balance at prior period"
      - name: period_movement
        description: "Net amount for the period"
      - name: closing_balance
        description: "Cumulative balance at current period"

  - name: gold_consolidated_ytd
    description: "Year-to-date running totals on fully consolidated trial balance"
    columns:
      - name: consolidation_group
        tests:
          - not_null
      - name: ytd_amount
        description: "Cumulative sum of amount through fiscal_period"

  # --- PRD-8 through PRD-22 models ---

  - name: gold_consolidation_hierarchy
    description: >
      PRD-8: the consolidation tree — parent, level, path. Structure only:
      F2 removed effective_ownership_pct, which held the DIRECT percentage and
      had no date grain. Ownership lives in gold_entity_ownership.
    columns:
      - name: consolidation_group
        tests:
          - not_null

  - name: gold_entity_ownership
    description: >
      F2: the one resolved answer to how much of an entity a group owns in a
      period, and how it is consolidated. One row per (ancestor group, entity,
      period): the effective share is the product of each link's dated
      percentage along the consolidation_ancestry chain, which is what makes
      consolidation multi-level.
    columns:
      - name: consolidation_group
        tests:
          - not_null
      - name: data_area_id
        tests:
          - not_null
      - name: effective_ownership_pct
        description: "Chain product, as a fraction. 0 when the chain is incomplete."
      - name: direct_ownership_pct
        description: "What the entity's IMMEDIATE parent owns of it, as a fraction."
      - name: has_complete_chain
        description: "0 when some link has no Ownership Period covering the period."
      - name: consolidation_method
        description: "The weakest method on the chain: full < proportional < equity < none."

  - name: gold_equity_method_associates
    description: "PRD-14: Equity method entries for associates (20-50% ownership)"
    columns:
      - name: consolidation_group
        tests:
          - not_null
      - name: main_account
        description: "EQ_INCOME or EQ_INVEST"
      - name: amount
        description: "Equity income or investment movement amount"

  - name: gold_acquisition_adjustments
    description: "PRD-11: Step acquisition adjustments — P&L proration and goodwill"
    columns:
      - name: consolidation_group
        tests:
          - not_null
      - name: adjustment_type
        description: "pnl_proration, goodwill, or fair_value_adjustment"
      - name: adjustment_amount
        description: "Amount of the acquisition adjustment"

  - name: gold_disposal_adjustments
    description: "PRD-12: Disposal gain/loss and CTA recycling"
    columns:
      - name: consolidation_group
        tests:
          - not_null
      - name: adjustment_type
        description: "disposal_gain_loss or cta_recycling"
      - name: gain_loss_amount
        description: "Disposal gain/loss or recycled CTA amount"

  - name: gold_nci_movement_schedule
    description: "PRD-13: NCI movement schedule with opening/closing reconciliation"
    columns:
      - name: consolidation_group
        tests:
          - not_null
      - name: data_area_id
        tests:
          - not_null
      - name: share_of_profit
        description: "NCI share of profit for the period"

  - name: gold_ic_reconciliation
    description: >
      Intercompany pairs (konsolidat#148, konsol#159): (entity, partner, account)
      against (partner, entity, counterpart) on flagged intercompany accounts,
      in group currency, with the matched amount, the difference and the
      group's tolerance.
    columns:
      - name: entity_a
        tests:
          - not_null
      - name: matched_amount
        description: "The smaller side when the two sides offset, else 0; eliminated"
      - name: difference
        description: "balance_a + balance_b: booked to ic_difference_account when the group has one"
      - name: match_status
        description: "matched, within_tolerance or over_tolerance (against the group's tolerance)"
        tests:
          - accepted_values:
              arguments:
                values: ['matched', 'within_tolerance', 'over_tolerance']

  - name: gold_ic_unmatched
    description: >
      Intercompany-account balances with no partner (decision 2, 13 Sep 2026):
      never eliminated, never guessed, listed here per group, period, entity
      and account. Includes every D365 line on an intercompany account until
      the ERP's partner is mapped.
    columns:
      - name: data_area_id
        tests:
          - not_null
      - name: unmatched_amount
        description: "In group currency (unmatched_local_amount: the entity's own)"

  - name: gold_allocation_audit_trail
    description: "Deprecated view over epm_allocated.alloc_audit_trail (scenario_id=ACTUAL)"
    columns:
      - name: allocation_run_id
        description: "Run identifier for traceability"
      - name: run_status
        description: "Active or Reversed"

  - name: gold_consolidation_waterfall
    description: "PRD-22: Consolidation waterfall — step-by-step build-up from entity to final"
    columns:
      - name: consolidation_group
        tests:
          - not_null
      - name: final_amount
        description: "Sum of all consolidation layers"

  - name: gold_consolidation_journal
    description: "PRD-22: Unified audit trail of all consolidation journal entries"
    columns:
      - name: adjustment_type
        tests:
          - not_null
      - name: journal_id
        description: "Journal identifier linking to source adjustment"

  # --- Phase 6.1: Cash Flow Statement (indirect method) ---

  - name: gold_cash_flow_indirect
    description: >
      Phase 6.1: Entity-level cash flow statement (indirect method), derived from
      the SIGNED trial balance (gold_trial_balance). cash_flow_amount =
      −(period_debit − period_credit) for every non-cash account; P&L accounts
      collapse into one Operating "Net Income" line, balance-sheet accounts use
      the cash_flow_categories seed for category/line. Ties to the cash account's
      signed movement by the double-entry identity.
    columns:
      - name: data_area_id
        tests:
          - not_null
      - name: cf_category
        description: "Operating / Investing / Financing"
        tests:
          - accepted_values:
              values: ['Operating', 'Investing', 'Financing']
      - name: cf_line_item
        description: "Seed sub-line, or 'Net Income' / 'Other Non-Cash Adjustments'"
      - name: cash_flow_amount
        description: "Cash effect = −(period_debit − period_credit), summed per line"

  - name: gold_consolidated_cash_flow
    description: >
      Phase 6.1: Group-level cash flow statement built after FX translation from
      gold_fully_consolidated_tb. Same categorization as the entity model; grain
      adds consolidation_group and rolls data_area_id up to the group.
    columns:
      - name: consolidation_group
        tests:
          - not_null
      - name: cf_category
        description: "Operating / Investing / Financing"
        tests:
          - accepted_values:
              values: ['Operating', 'Investing', 'Financing']
      - name: cf_line_item
        description: "Seed sub-line, or 'Net Income (Consolidated)' / 'Consolidation and Non-Cash Adjustments'"
      - name: cash_flow_amount
        description: "FX-translated cash effect = -amount (signed TB), summed per line"
