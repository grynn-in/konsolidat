version: 2

seeds:
  - name: entity_fiscal_calendars
    description: >
      Maps each D365 legal entity (data_area_id) to the fiscal calendar it posts
      against; silver_gl_entries joins on it to resolve fiscal_year/period. This
      is realistic reference data — most rows are entities NOT present in the
      D365 demo (e.g. CN01->Fiscal_CN, MYMF->Fiscal_MY), whose calendars aren't
      loaded; those rows are inert (no GL activity) and intentionally retained as
      a template for real multi-calendar deployments. Only entities that actually
      have GL data must reference a calendar that is loaded in
      silver_fiscal_periods — the demo's AMHQ/AMUS/AMDE map to `Standard`, the one
      calendar the demo loads. assert_fiscal_calendar_is_loaded (see #77) enforces
      that invariant for active entities, so a future activation of an entity
      pointing at an unloaded calendar fails the build instead of silently
      falling back to posting-date derivation. To support more calendars, load
      their period data into the raw/staging fiscal-calendar source.
  - name: cash_flow_categories
    description: >
      Phase 6.1 — maps each balance-sheet GL account to a cash flow category
      (Operating / Investing / Financing) and a sub-line label. `is_cash = 1`
      flags the cash/cash-equivalent account(s); they are excluded from the
      activity lines and instead define the reconciliation target (net change in
      cash). Consumed by gold_cash_flow_indirect and gold_consolidated_cash_flow,
      both of which derive the cash-flow sign from the SIGNED trial balance
      (period_debit − period_credit / signed consolidated amount) rather than
      this seed. The `sign` column is retained for reference only — it encoded
      the per-account-type sign needed when working from positive-magnitude
      balances, an approach abandoned once the models moved to signed movements.
    config:
      column_types:
        main_account: String
        cf_category: String
        cf_line_item: String
        is_cash: UInt8
        sign: Int8
    columns:
      - name: main_account
        description: "GL account (matches gold_bs_movement.main_account)"
      - name: cf_category
        description: "Operating, Investing, or Financing"
      - name: cf_line_item
        description: "Sub-line label (e.g. Change in Receivables, Dividends Paid)"
      - name: is_cash
        description: "1 = this account IS cash/cash-equivalent (excluded from activity, used for reconciliation)"
      - name: sign
        description: "Retained for reference only (legacy magnitude-era sign); models use signed debit−credit"

  - name: dimension_mappings
    description: >
      Dimension harmonization crosswalk — maps raw, ERP-local dimension values
      to canonical values, keyed by (dimension, erp_source, source_value).
      Consumed by the dim_harmonize() macro in per-ERP staging adapters.
      Generated from published `Dimension Mapping` docs by konsol's dbt_config,
      and hand-editable for bulk loads.
    config:
      column_types:
        dimension: String
        erp_source: String
        source_value: String
        canonical_value: String
        canonical_label: String
        status: String
    columns:
      - name: dimension
        description: "Canonical dimension name (e.g. dim_cost_center)"
      - name: erp_source
        description: "ERP this raw value comes from (matches stg_*.erp_source)"
      - name: source_value
        description: "Raw value as it appears in that ERP"
      - name: canonical_value
        description: "Harmonized target value"
      - name: canonical_label
        description: "Display label for the canonical value"
      - name: status
        description: "Draft / Published / Inactive — only Published rows are applied"

  - name: reporting_hierarchies
    description: >
      Management reporting hierarchies — parent/child rollups on canonical
      dimension values (BU, division, region, etc.). Distinct from the legal-
      entity Consolidation Group tree. Generated from published
      `Reporting Hierarchy` + `Reporting Hierarchy Member` docs in konsol.
    config:
      column_types:
        hierarchy_name: String
        dimension: String
        member_code: String
        member_label: String
        parent_member_code: String
        is_group: UInt8
        hierarchy_level: UInt8
        path: String
        effective_from: Date
        effective_to: Date
        is_default: UInt8
        status: String
    columns:
      - name: hierarchy_name
        description: "Hierarchy identifier, e.g. MGMT_2026"
      - name: dimension
        description: "Canonical dimension axis, e.g. dim_business_unit"
      - name: member_code
        description: "Node code — leaves match harmonized GL dimension values"
      - name: parent_member_code
        description: "Parent node code (empty for root)"
      - name: is_group
        description: "1 = rollup-only group node"
      - name: is_default
        description: "1 = default hierarchy for unassigned-member checks"
      - name: status
        description: "Only Published rows are consumed by gold models"

  - name: currencies
    description: >
      ISO 4217 currency reference (code, name, symbol, minor unit). Supplies the
      currency dimension that FX data validates against: from_currency /
      to_currency in silver_exchange_rates and entity accounting/reporting
      currencies are bare ISO codes with no other source of truth. Covers the
      major reserve / G20 / EU currencies plus every currency present in the demo
      FX data; extensible to the full ISO 4217 set. Ref grynn-in/konsolidat#91.
    config:
      column_types:
        currency_code: String
        currency_name: String
        symbol: String
        minor_unit: UInt8
    columns:
      - name: currency_code
        description: "ISO 4217 alphabetic code (3 letters), e.g. CHF"
        data_tests:
          - unique
          - not_null
      - name: currency_name
        description: "English currency name"
      - name: symbol
        description: "Common currency symbol"
      - name: minor_unit
        description: "ISO 4217 minor unit (decimal places); JPY=0, most=2, KWD/BHD/OMR=3"
