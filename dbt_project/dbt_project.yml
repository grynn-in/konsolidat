name: 'open_epm'
version: '1.0.0'
config-version: 2

profile: 'open_epm'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

vars:
  # ── Cluster mode (default OFF — single-node is the default deploy) ─────────
  # Set to true *only* when targeting a multi-node ClickHouse cluster:
  #   dbt build --target cluster --vars '{"cluster_enabled": true}'
  # When false, all cluster_* macros return the same values as the original
  # hardcoded literals; compiled SQL is byte-for-byte identical to pre-cluster.
  # See docs/admin-guide/cluster-setup.md for the full procedure.
  cluster_enabled: false

  # Active ERP source systems. This is the single switch that controls BOTH
  # which per-ERP staging models are built (see models.*.staging.<erp>.+enabled
  # below) AND which sources the canonical models UNION together. The shipped
  # demo data is D365-only, so the default is d365_fo. ERPNext deployments add
  # 'erpnext' here, or override at run time:
  #   dbt build --vars '{erp_sources: [d365_fo, erpnext]}'
  # NOTE: d365_fo must stay in this list. The bronze layer refs several
  # stg_d365_fo__* models directly (not via the canonical erp_sources loop), so
  # removing d365_fo would disable models that bronze still depends on. The
  # switch is "D365 mandatory, ERPNext optional", not a symmetric toggle.
  erp_sources:
    - d365_fo

  dimensions:
    - name: dim_cost_center
      source_column: dim_cost_center
      label: "Cost Center"
      cube_type: string
      in_budget: true
      allocation_role: cost_center
    - name: dim_department
      source_column: dim_department
      label: "Department"
      cube_type: string
      in_budget: true
    - name: dim_business_unit
      source_column: dim_business_unit
      label: "Business Unit"
      cube_type: string
      in_budget: false

  # Extra fiscal periods beyond 1-12 (D365: 0=opening, 13=closing, 14=adjustment)
  fiscal_extra_periods:
    - period: 0
      label: OPN
      quarter: OPN
      half: OPN
    - period: 13
      label: CLS
      quarter: CLS
      half: CLS

  # Fiscal period → quarter/half mapping (override for non-calendar fiscal years)
  fiscal_quarter_mapping:
    1: Q1
    2: Q1
    3: Q1
    4: Q2
    5: Q2
    6: Q2
    7: Q3
    8: Q3
    9: Q3
    10: Q4
    11: Q4
    12: Q4
  fiscal_half_mapping:
    1: H1
    2: H1
    3: H1
    4: H1
    5: H1
    6: H1
    7: H2
    8: H2
    9: H2
    10: H2
    11: H2
    12: H2

  base_measures:
    - name: period_debit
      expression: "sum(debit_amount)"
      label: "Debit"
      cube_type: sum
    - name: period_credit
      expression: "sum(credit_amount)"
      label: "Credit"
      cube_type: sum
    - name: period_net_amount
      expression: "sum(debit_amount) - sum(credit_amount)"
      label: "Net Amount"
      cube_type: sum
    - name: transaction_count
      expression: "count(*)"
      label: "Transaction Count"
      cube_type: sum

models:
  open_epm:
    staging:
      +schema: staging
      +materialized: view
      +tags: ['staging']
      # Per-ERP staging models are enabled only when their ERP is listed in the
      # `erp_sources` var (above). This keeps a fresh deploy from trying to build
      # staging models for an ERP whose raw tables were never loaded — which is
      # what caused the cascade of skipped downstream models (#60). The canonical
      # models UNION over the same var, so enablement and the union stay in sync.
      d365_fo:
        +enabled: "{{ 'd365_fo' in var('erp_sources', ['d365_fo']) }}"
        +tags: ['staging', 'd365_fo']
      erpnext:
        +enabled: "{{ 'erpnext' in var('erp_sources', ['d365_fo']) }}"
        +tags: ['staging', 'erpnext']
      canonical:
        +tags: ['staging', 'canonical']
    bronze:
      +schema: bronze
      +materialized: table
      +tags: ['bronze']
    silver:
      +schema: silver
      +materialized: table
      +tags: ['silver']
    allocated:
      +schema: allocated
      +materialized: table
      +tags: ['allocated', 'domain:consolidation']

    gold:
      +schema: gold
      +materialized: table
      +tags: ['gold']

      # --- Domain: staging (safe — no epm_raw dependency) ---
      gold_period_hierarchy:
        +tags: ['gold', 'domain:staging']
      gold_scenario_versions:
        +tags: ['gold', 'domain:staging']
      gold_consolidation_hierarchy:
        +tags: ['gold', 'domain:staging']
      gold_consolidation_adjustments:
        +tags: ['gold', 'domain:staging']
      gold_spread_budget:
        +tags: ['gold', 'domain:staging']

      # --- Domain: actuals (needs epm_raw — GL data from D365) ---
      gold_trial_balance:
        +tags: ['gold', 'domain:actuals']
      gold_ytd_trial_balance:
        +tags: ['gold', 'domain:actuals']
      gold_pnl_by_period:
        +tags: ['gold', 'domain:actuals']
      gold_pnl_quarterly:
        +tags: ['gold', 'domain:actuals']
      gold_pnl_half_yearly:
        +tags: ['gold', 'domain:actuals']
      gold_balance_sheet:
        +tags: ['gold', 'domain:actuals']
      gold_bs_movement:
        +tags: ['gold', 'domain:actuals']
      gold_prior_year_comparison:
        +tags: ['gold', 'domain:actuals']
      gold_consolidated_trial_balance:
        +tags: ['gold', 'domain:actuals']
      gold_fx_revaluation:
        +tags: ['gold', 'domain:actuals']

      # --- Domain: scenarios (needs epm_raw — unions actuals + budget) ---
      gold_scenario_trial_balance:
        +tags: ['gold', 'domain:scenarios']
      gold_variance_analysis:
        +tags: ['gold', 'domain:scenarios']
      gold_variance_ytd:
        +tags: ['gold', 'domain:scenarios']
      gold_variance_quarterly:
        +tags: ['gold', 'domain:scenarios']

      # --- Domain: consolidation (needs epm_raw transitively) ---
      gold_acquisition_adjustments:
        +tags: ['gold', 'domain:consolidation']
      gold_disposal_adjustments:
        +tags: ['gold', 'domain:consolidation']
      gold_ic_eliminations:
        +tags: ['gold', 'domain:consolidation']
      gold_ic_reconciliation:
        +tags: ['gold', 'domain:consolidation']
      gold_nci_movement_schedule:
        +tags: ['gold', 'domain:consolidation']
      gold_equity_method_associates:
        +tags: ['gold', 'domain:consolidation']
      gold_fully_consolidated_tb:
        +tags: ['gold', 'domain:consolidation']
      gold_consolidation_waterfall:
        +tags: ['gold', 'domain:consolidation']
      gold_consolidation_journal:
        +tags: ['gold', 'domain:consolidation']
      gold_consolidated_ytd:
        +tags: ['gold', 'domain:consolidation']
      gold_allocation_results:
        +materialized: view
        +tags: ['gold', 'domain:consolidation', 'deprecated']
      gold_allocation_audit_trail:
        +materialized: view
        +tags: ['gold', 'domain:consolidation', 'deprecated']

      # --- Domain: reporting (management hierarchy rollups) ---
      gold_reporting_hierarchy:
        +tags: ['gold', 'domain:reporting']
      gold_reporting_hierarchy_closure:
        +tags: ['gold', 'domain:reporting']
      gold_tb_at_hierarchy_node:
        +tags: ['gold', 'domain:reporting']
      gold_unassigned_hierarchy_members:
        +tags: ['gold', 'domain:reporting']
      gold_budget_at_hierarchy_node:
        +tags: ['gold', 'domain:reporting']
      gold_variance_at_hierarchy_node:
        +tags: ['gold', 'domain:reporting']

seeds:
  open_epm:
    +schema: gold
    allocation_rules:
      +column_types:
        source_account: "String"
        target_account: "String"
        step_order: "UInt8"
    ic_elimination_rules:
      +column_types:
        debit_account: "String"
        credit_account: "String"
    consolidation_groups:
      +column_types:
        ownership_pct: "Decimal(5,2)"
    consolidation_adjustments:
      +column_types:
        consolidation_group: "String"
        adjustment_type: "String"
        journal_id: "String"
        data_area_id: "String"
        fiscal_year: "UInt16"
        fiscal_period: "UInt8"
        main_account: "String"
        debit_amount: "Decimal(18,2)"
        credit_amount: "Decimal(18,2)"
        description: "String"
        posted_by: "String"
    test_consolidation_hierarchy:
      +column_types:
        consolidation_group: "String"
        data_area_id: "String"
        parent_group: "String"
        hierarchy_level: "UInt8"
        effective_ownership_pct: "Decimal(5,2)"
        path: "String"
