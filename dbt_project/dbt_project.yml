name: 'open_epm'
version: '1.0.0'
config-version: 2

profile: 'open_epm'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

vars:
  dimensions:
    - name: dim_cost_center
      source_column: CostCenter
      label: "Cost Center"
      cube_type: string
      in_budget: true
      allocation_role: cost_center
    - name: dim_department
      source_column: Department
      label: "Department"
      cube_type: string
      in_budget: true
    - name: dim_business_unit
      source_column: BusinessUnit
      label: "Business Unit"
      cube_type: string
      in_budget: false

  # Extra fiscal periods beyond 1-12 (D365: 0=opening, 13=closing, 14=adjustment)
  fiscal_extra_periods:
    - period: 0
      label: OPN
      quarter: OPN
      half: OPN
    - period: 13
      label: CLS
      quarter: CLS
      half: CLS

  # Fiscal period → quarter/half mapping (override for non-calendar fiscal years)
  fiscal_quarter_mapping:
    1: Q1
    2: Q1
    3: Q1
    4: Q2
    5: Q2
    6: Q2
    7: Q3
    8: Q3
    9: Q3
    10: Q4
    11: Q4
    12: Q4
  fiscal_half_mapping:
    1: H1
    2: H1
    3: H1
    4: H1
    5: H1
    6: H1
    7: H2
    8: H2
    9: H2
    10: H2
    11: H2
    12: H2

  base_measures:
    - name: period_debit
      expression: "sum(debit_amount)"
      label: "Debit"
      cube_type: sum
    - name: period_credit
      expression: "sum(credit_amount)"
      label: "Credit"
      cube_type: sum
    - name: period_net_amount
      expression: "sum(accounting_currency_amount)"
      label: "Net Amount"
      cube_type: sum
    - name: transaction_count
      expression: "count(*)"
      label: "Transaction Count"
      cube_type: sum

models:
  open_epm:
    staging:
      +schema: staging
      +materialized: view
      +tags: ['staging']
    bronze:
      +schema: bronze
      +materialized: table
      +tags: ['bronze']
    silver:
      +schema: silver
      +materialized: table
      +tags: ['silver']
    gold:
      +schema: gold
      +materialized: table
      +tags: ['gold']

seeds:
  open_epm:
    +schema: gold
    consolidation_groups:
      +column_types:
        ownership_pct: "Decimal(5,2)"
    consolidation_adjustments:
      +column_types:
        consolidation_group: "String"
        adjustment_type: "String"
        journal_id: "String"
        data_area_id: "String"
        fiscal_year: "UInt16"
        fiscal_period: "UInt8"
        main_account: "String"
        debit_amount: "Decimal(18,2)"
        credit_amount: "Decimal(18,2)"
        description: "String"
        posted_by: "String"
