# =============================================================================
# Konsolidat — One-Click Deployment
# =============================================================================
# Usage:  ./deploy.sh              (first time)
#         docker compose up -d     (subsequent starts)
#         docker compose down      (stop all)
# =============================================================================

x-frappe-common: &frappe-common
  build:
    context: ./docker/frappe
    args:
      FRAPPE_BRANCH: ${FRAPPE_BRANCH:-version-15}
  environment: &frappe-env
    DB_HOST: mariadb
    DB_PORT: "3306"
    REDIS_CACHE_HOST: redis_cache
    REDIS_QUEUE_HOST: redis_queue
    SITE_NAME: ${SITE_NAME:-konsolidat.local}
    CLICKHOUSE_HOST: clickhouse
    CLICKHOUSE_PORT: "8123"
    CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
    CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?run ./deploy.sh to generate secrets in .env}
    # dbt config (for pipeline runner)
    DBT_PROJECT_DIR: /home/frappe/dbt_project
  volumes:
    - frappe_sites:/home/frappe/frappe-bench/sites
    - frappe_logs:/home/frappe/frappe-bench/logs
    - ./dbt_project:/home/frappe/dbt_project
  depends_on:
    mariadb:
      condition: service_healthy
    redis_cache:
      condition: service_healthy
    redis_queue:
      condition: service_healthy
    clickhouse:
      condition: service_healthy

services:
  # ---------------------------------------------------------------------------
  # Infrastructure
  # ---------------------------------------------------------------------------
  mariadb:
    image: mariadb:10.11
    container_name: konsolidat_mariadb
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?run ./deploy.sh to generate secrets in .env}
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis_cache:
    image: redis:7-alpine
    container_name: konsolidat_redis_cache
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  redis_queue:
    image: redis:7-alpine
    container_name: konsolidat_redis_queue
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    container_name: konsolidat_clickhouse
    networks:
      default:
        # Pinned IP so the Airbyte kind cluster (which attaches to this network
        # in scripts/setup-airbyte.sh) has a stable ClickHouse address. Airbyte
        # pods use CoreDNS and cannot resolve the container name.
        ipv4_address: 172.30.0.10
    ports:
      - "${CLICKHOUSE_BIND:-127.0.0.1}:${CLICKHOUSE_HTTP_PORT:-8123}:8123"    # HTTP API (loopback by default)
      - "${CLICKHOUSE_BIND:-127.0.0.1}:${CLICKHOUSE_NATIVE_PORT:-9000}:9000"  # Native protocol (loopback by default)
      - "${CLICKHOUSE_BIND:-127.0.0.1}:${EXCEL_ODBC_PORT:-15432}:15432"       # PostgreSQL wire (Excel/ODBC, loopback by default)
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?run ./deploy.sh to generate secrets in .env}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - clickhouse_logs:/var/log/clickhouse-server
      - ./clickhouse/init-db.sql:/docker-entrypoint-initdb.d/01-init-db.sql:ro
      - ./clickhouse/demo-data.sql:/docker-entrypoint-initdb.d/02-demo-data.sql:ro
      - ./clickhouse/postgres_compat.xml:/etc/clickhouse-server/config.d/postgres_compat.xml:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # One-shot: Site setup (runs once, then exits)
  # ---------------------------------------------------------------------------
  configurator:
    <<: *frappe-common
    container_name: konsolidat_configurator
    entrypoint: ["bash", "/home/frappe/configurator/init.sh"]
    environment:
      <<: *frappe-env
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?run ./deploy.sh to generate secrets in .env}
      DB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?run ./deploy.sh to generate secrets in .env}
    volumes:
      - frappe_sites:/home/frappe/frappe-bench/sites
      - frappe_logs:/home/frappe/frappe-bench/logs
      - ./docker/configurator/init.sh:/home/frappe/configurator/init.sh:ro
    restart: "no"
    profiles:
      - setup

  # ---------------------------------------------------------------------------
  # Application
  # ---------------------------------------------------------------------------
  frappe_backend:
    <<: *frappe-common
    container_name: konsolidat_backend
    command: ["web"]
    ports:
      - "${FRAPPE_PORT:-8069}:8069"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -H \"Host: ${SITE_NAME:-konsolidat.local}\" http://localhost:8069/api/method/ping"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  frappe_worker:
    <<: *frappe-common
    container_name: konsolidat_worker
    command: ["worker"]
    restart: unless-stopped

  frappe_scheduler:
    <<: *frappe-common
    container_name: konsolidat_scheduler
    command: ["scheduler"]
    restart: unless-stopped

  cubejs:
    image: cubejs/cube:v0.36
    container_name: konsolidat_cubejs
    ports:
      - "${CUBEJS_PORT:-4000}:4000"
    environment:
      CUBEJS_DB_TYPE: clickhouse
      CUBEJS_DB_HOST: clickhouse
      CUBEJS_DB_PORT: "8123"
      CUBEJS_DB_USER: ${CLICKHOUSE_USER:-default}
      CUBEJS_DB_PASS: ${CLICKHOUSE_PASSWORD:?run ./deploy.sh to generate secrets in .env}
      CUBEJS_DB_NAME: epm_gold
      CUBEJS_API_SECRET: ${CUBEJS_API_SECRET:?Run ./deploy.sh to generate CUBEJS_API_SECRET}
      CUBEJS_DEV_MODE: ${CUBEJS_DEV_MODE:-false}
      CUBEJS_SCHEMA_PATH: /cube/schema
    volumes:
      - ./cube/schema:/cube/schema:ro
      - ./cube/views:/cube/views:ro
    depends_on:
      clickhouse:
        condition: service_healthy
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # One-shot: dbt seed + build (runs once after setup, then exits)
  # ---------------------------------------------------------------------------
  dbt_init:
    <<: *frappe-common
    container_name: konsolidat_dbt_init
    entrypoint: ["/home/frappe/frappe-bench/env/bin/dbt"]
    command: ["build", "--profiles-dir", "/home/frappe/dbt_project", "--project-dir", "/home/frappe/dbt_project"]
    restart: "no"
    profiles:
      - setup

  # ---------------------------------------------------------------------------
  # Reverse proxy (auto-SSL when domain is set)
  # ---------------------------------------------------------------------------
  caddy:
    image: caddy:2-alpine
    container_name: konsolidat_caddy
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-localhost}
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frappe_backend
      - cubejs
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Nightly backup (runs via cron label or docker compose run)
  # ---------------------------------------------------------------------------
  backup:
    <<: *frappe-common
    container_name: konsolidat_backup
    entrypoint: ["bash", "/home/frappe/backup/backup.sh"]
    environment:
      <<: *frappe-env
      DB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?run ./deploy.sh to generate secrets in .env}
      BACKUP_DIR: /backups
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
    volumes:
      - frappe_sites:/home/frappe/frappe-bench/sites:ro
      - ./docker/backup/backup.sh:/home/frappe/backup/backup.sh:ro
      - ${BACKUP_PATH:-./backups}:/backups
    restart: "no"
    profiles:
      - backup

volumes:
  mariadb_data:
  clickhouse_data:
  clickhouse_logs:
  frappe_sites:
  frappe_logs:
  caddy_data:
  caddy_config:

networks:
  default:
    name: open_epm
    ipam:
      config:
        # Fixed subnet so ClickHouse can hold a stable IP (172.30.0.10) that the
        # Airbyte kind cluster connects to. Change this block if it collides with
        # an existing Docker network on the host.
        - subnet: 172.30.0.0/24
