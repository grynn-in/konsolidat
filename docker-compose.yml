services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    container_name: open_epm_clickhouse
    ports:
      - "8123:8123"   # HTTP
      - "9000:9000"   # Native
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-open_epm_dev}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - clickhouse_logs:/var/log/clickhouse-server
      - ./clickhouse/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  dagster_postgres:
    image: postgres:16-alpine
    container_name: open_epm_dagster_pg
    environment:
      POSTGRES_USER: ${DAGSTER_PG_USER:-dagster}
      POSTGRES_PASSWORD: ${DAGSTER_PG_PASSWORD:-dagster_dev}
      POSTGRES_DB: ${DAGSTER_PG_DB:-dagster}
    volumes:
      - dagster_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dagster"]
      interval: 10s
      timeout: 5s
      retries: 5

  dagster_webserver:
    build:
      context: .
      dockerfile: docker/Dockerfile.dagster
    container_name: open_epm_dagster_web
    entrypoint: ["dagster-webserver", "-h", "0.0.0.0", "-p", "3000"]
    ports:
      - "3000:3000"
    environment:
      DAGSTER_HOME: /opt/dagster/dagster_home
      DAGSTER_PG_HOST: dagster_postgres
      DAGSTER_PG_PORT: 5432
      DAGSTER_PG_USER: ${DAGSTER_PG_USER:-dagster}
      DAGSTER_PG_PASSWORD: ${DAGSTER_PG_PASSWORD:-dagster_dev}
      DAGSTER_PG_DB: ${DAGSTER_PG_DB:-dagster}
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 8123
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-open_epm_dev}
      AIRBYTE_API_URL: ${AIRBYTE_API_URL:-http://host.docker.internal:8000}
    volumes:
      - ./dagster:/opt/dagster/app/dagster
      - ./dbt_project:/opt/dagster/app/dbt_project
    depends_on:
      dagster_postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy

  dagster_daemon:
    build:
      context: .
      dockerfile: docker/Dockerfile.dagster
    container_name: open_epm_dagster_daemon
    entrypoint: ["dagster-daemon", "run"]
    environment:
      DAGSTER_HOME: /opt/dagster/dagster_home
      DAGSTER_PG_HOST: dagster_postgres
      DAGSTER_PG_PORT: 5432
      DAGSTER_PG_USER: ${DAGSTER_PG_USER:-dagster}
      DAGSTER_PG_PASSWORD: ${DAGSTER_PG_PASSWORD:-dagster_dev}
      DAGSTER_PG_DB: ${DAGSTER_PG_DB:-dagster}
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 8123
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-open_epm_dev}
      AIRBYTE_API_URL: ${AIRBYTE_API_URL:-http://host.docker.internal:8000}
    volumes:
      - ./dagster:/opt/dagster/app/dagster
      - ./dbt_project:/opt/dagster/app/dbt_project
    depends_on:
      dagster_postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy

  cube:
    image: cubejs/cube:v0.36
    container_name: open_epm_cube
    ports:
      - "4000:4000"    # API
      - "15432:15432"  # SQL API (Postgres wire protocol)
    environment:
      CUBEJS_DB_TYPE: clickhouse
      CUBEJS_DB_HOST: clickhouse
      CUBEJS_DB_PORT: 8123
      CUBEJS_DB_USER: ${CLICKHOUSE_USER:-default}
      CUBEJS_DB_PASS: ${CLICKHOUSE_PASSWORD:-open_epm_dev}
      CUBEJS_DB_NAME: epm_gold
      CUBEJS_DEV_MODE: ${CUBEJS_DEV_MODE:-true}
      CUBEJS_API_SECRET: ${CUBEJS_API_SECRET:-open_epm_dev_secret}
      CUBEJS_SQL_PORT: 15432
      CUBEJS_SQL_USER: ${CUBEJS_SQL_USER:-epm_excel}
      CUBEJS_SQL_PASSWORD: ${CUBEJS_SQL_PASSWORD:-epm_excel_password}
      CUBEJS_TELEMETRY: "false"
    volumes:
      - ./cube:/cube/conf
    depends_on:
      clickhouse:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: open_epm_api
    ports:
      - "8080:8080"
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 8123
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-open_epm_dev}
      API_HOST: 0.0.0.0
      API_PORT: 8080
    depends_on:
      clickhouse:
        condition: service_healthy

  streamlit:
    build:
      context: .
      dockerfile: docker/Dockerfile.streamlit
    container_name: open_epm_streamlit
    ports:
      - "8501:8501"
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 8123
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-open_epm_dev}
      DAGSTER_URL: http://dagster_webserver:3000
    volumes:
      - ./streamlit:/app
    depends_on:
      clickhouse:
        condition: service_healthy

volumes:
  clickhouse_data:
  clickhouse_logs:
  dagster_pg_data:
