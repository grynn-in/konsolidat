name: dbt checks

on:
  push:
    branches: [main]
    paths:
      - 'dbt_project/**'
      - 'scripts/check_gold_domains.py'
      - '.github/workflows/dbt-checks.yml'
      - 'clickhouse/init-db.sql'
      - 'tests/test_governed_chart_ddl.py'
      - 'tests/test_tb_only_first_build.py'
      - 'tests/test_consolidation_core_thread_cap.py'
      - 'tests/test_no_shipped_dimensions.py'
      - 'tests/test_no_month_period_macro.py'
      - 'tests/test_budget_models_read_no_erp.py'
      - 'tests/test_raw_submission_ddl.py'
      - 'tests/test_fiscal_periods_ddl.py'
      - 'tests/test_deal_tables_ddl.py'
      - 'tests/test_consolidation_adjustments_ddl.py'
      - 'tests/test_reporting_hierarchies_ddl.py'
      - 'tests/test_cash_flow_categories_ddl.py'
      - 'tests/test_sync_watermark_ddl.py'
      - 'tests/test_historical_equity_rates_ddl.py'
      - 'tests/test_group_exchange_rates_ddl.py'
      - 'tests/test_rate_sets_ddl.py'
      - 'tests/test_budget_cycles_ddl.py'
      - 'tests/test_rate_set_filter.py'
      - 'deploy.sh'
      - 'tests/test_ownership_graph_ddl.py'
      - 'tests/test_cost_allocation_ddl.py'
      - 'tests/test_fixture_only_tests.py'
      - 'clickhouse/raw-schema.sql'
      - 'scripts/tb_only_first_build.py'
      - 'scripts/ci_full_build.py'
      - 'scripts/fixture_gate.py'
      - 'tests/test_ci_full_build.py'
      - 'tests/integration/**'
      - 'scripts/report_subsections.py'
      - 'scripts/build_consolidation_report.py'
      - 'tests/test_report_subsections.py'
      - 'tests/test_gold_domain_coverage.py'
  pull_request:
    paths:
      - 'dbt_project/**'
      - 'scripts/check_gold_domains.py'
      - '.github/workflows/dbt-checks.yml'
      - 'clickhouse/init-db.sql'
      - 'tests/test_governed_chart_ddl.py'
      - 'tests/test_tb_only_first_build.py'
      - 'tests/test_consolidation_core_thread_cap.py'
      - 'tests/test_no_shipped_dimensions.py'
      - 'tests/test_no_month_period_macro.py'
      - 'tests/test_budget_models_read_no_erp.py'
      - 'tests/test_raw_submission_ddl.py'
      - 'tests/test_fiscal_periods_ddl.py'
      - 'tests/test_deal_tables_ddl.py'
      - 'tests/test_consolidation_adjustments_ddl.py'
      - 'tests/test_reporting_hierarchies_ddl.py'
      - 'tests/test_cash_flow_categories_ddl.py'
      - 'tests/test_sync_watermark_ddl.py'
      - 'tests/test_historical_equity_rates_ddl.py'
      - 'tests/test_group_exchange_rates_ddl.py'
      - 'tests/test_rate_sets_ddl.py'
      - 'tests/test_budget_cycles_ddl.py'
      - 'tests/test_rate_set_filter.py'
      - 'deploy.sh'
      - 'tests/test_ownership_graph_ddl.py'
      - 'tests/test_cost_allocation_ddl.py'
      - 'tests/test_fixture_only_tests.py'
      - 'clickhouse/raw-schema.sql'
      - 'scripts/tb_only_first_build.py'
      - 'scripts/ci_full_build.py'
      - 'scripts/fixture_gate.py'
      - 'tests/test_ci_full_build.py'
      - 'tests/integration/**'
      - 'scripts/report_subsections.py'
      - 'scripts/build_consolidation_report.py'
      - 'tests/test_report_subsections.py'
      - 'tests/test_gold_domain_coverage.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gold-domain-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: pip install pyyaml
      - name: Every gold model has a known Build Governance domain
        run: python scripts/check_gold_domains.py dbt_project/dbt_project.yml
      # The guard itself: it used to enumerate the YAML, so a model never
      # registered as a Build Model was invisible to it. Five had accumulated.
      - name: the gold-domain guard reads the directory, not only the YAML
        run: python -m unittest -v tests.test_gold_domain_coverage

  dbt-parse:
    name: dbt project parses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      # Pinned to what the running stack installs (docker/frappe/Dockerfile).
      - run: pip install "dbt-core==1.12.3" "dbt-clickhouse==1.9.3"
      # No connection needed: parse compiles the DAG without touching
      # ClickHouse, and profiles.yml's dev target defaults every env var.
      #
      # This is the check that was missing when the whole build silently
      # stopped producing models (#139): a Compilation Error — an enabled flag
      # disagreeing with a ref, a model renamed but still referenced, a stray
      # file with a space in its name — fails here instead of being discovered
      # on a live stack that had been stale for hours.
      - name: dbt parse
        run: >
          dbt parse --no-partial-parse
          --profiles-dir dbt_project --project-dir dbt_project

  contract-tests:
    name: warehouse contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      # konsol#182: the governed chart's DDL is byte-identical to konsol's, and
      # silver and the guard read every one of its columns. Plain unittest, no
      # installs: nothing else in tests/ runs in CI.
      - name: governed chart DDL and column coverage
        run: python -m unittest -v tests.test_governed_chart_ddl
      # #191: the TB-only first build runs the cast test by name.
      - name: first-build script runs the cast test
        run: python -m unittest -v tests.test_tb_only_first_build
      # konsol#287: the shipped dimensions default is empty, the canonical union
      # names no dimension, and the fixture builds declare their own.
      - name: no shipped dimensions
        run: python -m unittest -v tests.test_no_shipped_dimensions
      # konsol#348: no period is dated by its number; the declared calendar
      # (declared_periods()) is the one source of period dates.
      - name: no calendar-month period macro
        run: python -m unittest -v tests.test_no_month_period_macro
      # konsol#348 S3 (B1, QB1 b): the budget and variance models read no ERP
      # model or source; the budget enters through konsol's two tables only.
      - name: budget and variance models read no ERP
        run: python -m unittest -v tests.test_budget_models_read_no_erp
      # konsol#348 S4 (W7): the budget stays outside the close. The close
      # fingerprint's one relation reaches no budget model or source, the budget
      # models reach no actuals consolidation, and both are documented "before
      # eliminations" (konsol#427, #425).
      - name: budget outside the close
        run: python -m unittest -v tests.test_budget_outside_close
      # konsolidat#369: the budget's ownership resolution is materialised once
      # (gold_budget_entity_ownership); no budget reader re-plans it inline.
      - name: budget ownership materialised once
        run: python -m unittest -v tests.test_budget_ownership_materialised
      # konsol#348 S4b live test: a seed statement ClickHouse refuses fails its
      # fixture with a reason instead of crashing the gate.
      # konsolidat#369: the core keeps ClickHouse's thread cap on an all-empty
      # warehouse (system.one in entity_tb) and the budget's partner is a column,
      # not a constant, so its window chain has the actuals' shape.
      - name: consolidation core keeps the thread cap on an empty warehouse
        run: python -m unittest -v tests.test_consolidation_core_thread_cap
      - name: fixture gate fails a refused seed per fixture
        run: python -m unittest -v tests.test_fixture_gate_seed_errors
      # konsolidat#199: the TB submission control table's DDL is konsol's,
      # including amount_basis, and the CI fixture claims its batch by name.
      - name: raw submission control DDL and CI claim
        run: python -m unittest -v tests.test_raw_submission_ddl
      # konsolidat#199: the fiscal calendar's DDL is konsol's, it is a declared
      # dbt source, and the CI fixture seeds it with a Closing period.
      - name: fiscal calendar DDL, source and CI seed
        run: python -m unittest -v tests.test_fiscal_periods_ddl
      # konsolidat#198: the six deal tables and the group's policy/account
      # columns are konsol's DDL, verbatim, and declared dbt sources.
      - name: deal tables DDL and sources
        run: python -m unittest -v tests.test_deal_tables_ddl
      # konsol#353 option C: Consolidation Journal amounts are konsol's DDL,
      # verbatim, at Decimal(20,4), so a 3-decimal currency is stored exactly.
      - name: consolidation journal DDL keeps 4 decimal places
        run: python -m unittest -v tests.test_consolidation_adjustments_ddl
      # konsol#220: reporting_hierarchies is konsol's DDL, verbatim, including
      # the dated member tranche columns, declared on the dbt source.
      - name: reporting hierarchies DDL and tranche columns
        run: python -m unittest -v tests.test_reporting_hierarchies_ddl
      # konsol#197: cash_flow_categories is konsol's DDL, verbatim, without the
      # `sign` column that nothing read.
      - name: cash flow categories DDL without the retired sign
        run: python -m unittest -v tests.test_cash_flow_categories_ddl
      # konsolidat#246: the sync watermark is konsol's DDL, verbatim, with the
      # reconcile run id in its sort key, and the upgrade is asked first.
      - name: sync watermark DDL carries the reconcile run id
        run: python -m unittest -v tests.test_sync_watermark_ddl
      # konsol#374: a Historical Equity Rate is keyed by the presentation
      # currency it converts into; init-db.sql, konsol's DDL, the model's join
      # and every fixture agree on the column.
      - name: historical equity rates DDL carries the To currency and the Rate Set
        run: python -m unittest -v tests.test_historical_equity_rates_ddl
      # konsol#348 S4 (W1): a governed rate names its Rate Set, last in the
      # column list and outside the key; every fixture rate names it.
      - name: group exchange rates DDL carries the Rate Set
        run: python -m unittest -v tests.test_group_exchange_rates_ddl
      # konsol#348 S4-Q7 (a): the Rate Sets table names the one actuals set;
      # every fixture that seeds a rate seeds its set, and so does the TB-only
      # first build.
      - name: rate sets DDL and the one actuals set
        run: python -m unittest -v tests.test_rate_sets_ddl
      # konsol#348 S4-Q2 (a): an approved Budget Cycle reaches the warehouse
      # with its declared Rate Set.
      - name: budget cycles DDL carries the Rate Set
        run: python -m unittest -v tests.test_budget_cycles_ddl
      # konsol#348 S4 (W2): every reader of a governed or historical rate names
      # the Rate Set it reads; the model, the guard and the deploy precheck take
      # the one flagged Is Actuals.
      - name: every rate reader names its Rate Set
        run: python -m unittest -v tests.test_rate_set_filter
      # konsol#117 pair 1: ownership is a graph. The link's owner is in the
      # periods table's key, the closure carries path_id and the link owner,
      # the method declarations table exists, and every INSERT into the two
      # widened tables names its columns.
      - name: ownership graph DDL, sources and column-named inserts
        run: python -m unittest -v tests.test_ownership_graph_ddl
      # konsolidat#335 (X22): the integration fixture that ends links with no
      # Business Disposal declares the exit journal's gain or loss account.
      - name: integration fixture declares its exit account
        run: python -m unittest -v tests.test_ic_decisions_exit_account
      # konsol#269 (W1): the six cost allocation staging tables are konsol's DDL,
      # verbatim, and declared dbt sources.
      - name: cost allocation staging DDL and sources
        run: python -m unittest -v tests.test_cost_allocation_ddl
      # konsol#348 S4 (W3): the test that re-runs the consolidation core is
      # fixture-only: disabled by default, enabled by the gate's and this
      # workflow's --vars payloads, and its header does not swallow its query.
      - name: fixture-only tests stay out of site builds
        run: python -m unittest -v tests.test_fixture_only_tests
      # konsolidat#181: the full-build job builds everything, guards the
      # zero-dimension case (konsolidat#220) and fails on a skipped test.
      - name: full-build job builds everything and fails on a skip
        run: python -m unittest -v tests.test_ci_full_build
      # konsolidat#185: the consolidation report takes its sub-sections from
      # the chart's declared sub_section, and names every account it had to
      # place by account-number prefix instead.
      - name: report sub-sections come from the chart, not the account number
        run: python -m unittest -v tests.test_report_subsections

  full-build:
    name: full build + assertions on a throwaway ClickHouse
    runs-on: ubuntu-latest
    # konsolidat#181. `dbt parse` does not validate SQL, and the scoped build
    # below is not the project: 375 nodes, 310 reachable from
    # @silver_main_accounts, 65 not — including eight singular assertions that
    # ran in no job at all, three of them the FX rate guards. tests/integration
    # never ran either: it skips itself when ClickHouse is unreachable, and no
    # job gave it one — and run for the first time it gave 7 failed, 30 passed,
    # 5 skipped, 3 errors.
    #
    # konsolidat#227 is now done and the suite is ON here. It is 10 tests, not
    # 30: 20 were deleted because they could not fail, duplicated this job, or
    # only asserted that the warehouse exists. What remains is the consolidation
    # arithmetic no other test can reach — an intercompany partner, ownership
    # below 100%, minority interest, equity method, a mid-year acquisition, a
    # disposal — none of which exists in live data or in the ZZ fixture, which
    # is why the thirteen assertions over gold_ic_* otherwise run on an empty
    # table. Measured green from a clean warehouse: full build PASS=320
    # ERROR=0 SKIP=0, suite 10 passed 0 skipped, zero-dimension build PASS=321.
    services:
      clickhouse:
        # Pinned to the running stack's major version (24.8).
        image: clickhouse/clickhouse-server:24.8
        env:
          CLICKHOUSE_PASSWORD: ci
        ports:
          - 8123:8123
        options: >-
          --health-cmd "wget -qO- http://localhost:8123/ping"
          --health-interval 5s --health-timeout 5s --health-retries 30
    env:
      CLICKHOUSE_HOST: localhost
      CLICKHOUSE_PORT: '8123'
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      # pytest and requests are what tests/integration/conftest.py imports.
      - run: pip install "dbt-core==1.12.3" "dbt-clickhouse==1.9.3" pytest requests
      - name: full dbt build at real and zero dimensions, then the integration suite
        # A skip is a failure here (ci_full_build.py:135-139). That is why
        # tests/integration/test_frappe_sync.py had to go rather than be
        # repaired: it resolved konsol through KONSOL_APP_PATH, which was set
        # nowhere, and skipped all 7 of its tests on any machine without
        # ~/frappe-bench — so this runner could never have gone green with it in
        # place, whatever else was fixed.
        run: python scripts/ci_full_build.py --with-integration
      - name: upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-build-logs
          path: ci-logs/
          if-no-files-found: ignore

  fixture-gate:
    name: test fixtures make their tests pass or flag
    runs-on: ubuntu-latest
    # 75, raised from 45 on 11 Nov 2026: #345 took the fixtures from 153 to 186
    # and the job from ~26 min to 35-45 min; on main it was cancelled at 45 min
    # after 175 of 186 fixtures, twice. The fixtures run one by one (~14 s each).
    timeout-minutes: 75
    # konsolidat#266 (Deepak Pai, 11 Oct 2026, option G-1). Every fixture in
    # dbt_project/test_fixtures runs: a `.must_flag.` fixture must make its
    # test FAIL or WARN, any other must make it PASS. A test that cannot fail
    # passes both, and this is the job that notices. konsolidat#249 and #238
    # were tests that could not fail; #261 added fixtures nothing ran.
    #
    # The fixtures are cloned into zzg_* scratch databases with the epm_*
    # DDL. A throwaway has no live stack, so --prepare-ci builds one first:
    # clickhouse/*.sql for the sources, then `dbt run` for the model tables,
    # which those files do not declare (scripts/fixture_gate.py says why).
    # That prepare step is a full `dbt run`: a model that does not build
    # stops this job there, before any fixture runs, and the full-build job
    # names the model.
    #
    # Memory: gold_business_combination_journal uses ~1.3 GiB per query even
    # on a one-deal fixture (konsolidat#269). On a 3 GB ClickHouse seven deal
    # fixtures failed MEMORY_LIMIT_EXCEEDED; a hosted runner has room.
    services:
      clickhouse:
        # Pinned to the running stack's major version (24.8).
        image: clickhouse/clickhouse-server:24.8
        env:
          CLICKHOUSE_PASSWORD: ci
        ports:
          - 8123:8123
        options: >-
          --health-cmd "wget -qO- http://localhost:8123/ping"
          --health-interval 5s --health-timeout 5s --health-retries 30
    env:
      CLICKHOUSE_HOST: localhost
      CLICKHOUSE_PORT: '8123'
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install "dbt-core==1.12.3" "dbt-clickhouse==1.9.3"
      - name: every fixture, against the DDL of a fresh build
        run: python scripts/fixture_gate.py --all --prepare-ci --log-dir ci-logs/fixtures
      - name: upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fixture-gate-logs
          path: ci-logs/
          if-no-files-found: ignore

  tb-only-first-build:
    name: first build on a fresh TB-only site
    runs-on: ubuntu-latest
    # The job takes about 2 minutes. After #262 a query plan that grew without
    # bound held it for 48 minutes before anyone saw a result; fail it instead.
    timeout-minutes: 15
    # konsol#182: the canonical path is trial balances uploaded via CSV, so a
    # fresh site has no ERP rows and no ERP FX quotes.
    # `dbt parse` does not validate SQL; this builds the selection for real on
    # the empty init-db.sql + raw-schema.sql shape, then with a ZZ fixture.
    services:
      clickhouse:
        # Pinned to the running stack's major version (24.8).
        image: clickhouse/clickhouse-server:24.8
        env:
          CLICKHOUSE_PASSWORD: ci
        ports:
          - 8123:8123
        options: >-
          --health-cmd "wget -qO- http://localhost:8123/ping"
          --health-interval 5s --health-timeout 5s --health-retries 30
    env:
      CLICKHOUSE_HOST: localhost
      CLICKHOUSE_PORT: '8123'
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: pip install "dbt-core==1.12.3" "dbt-clickhouse==1.9.3"
      - name: dbt build --select @silver_main_accounts (empty, then ZZ fixture)
        run: python scripts/tb_only_first_build.py --prefix ci_fb --fixture
