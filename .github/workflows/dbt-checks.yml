name: dbt checks

on:
  push:
    branches: [main]
    paths:
      - 'dbt_project/**'
      - 'scripts/check_gold_domains.py'
      - '.github/workflows/dbt-checks.yml'
      - 'clickhouse/init-db.sql'
      - 'tests/test_governed_chart_ddl.py'
      - 'tests/test_tb_only_first_build.py'
      - 'tests/test_raw_submission_ddl.py'
      - 'tests/test_fiscal_periods_ddl.py'
      - 'tests/test_deal_tables_ddl.py'
      - 'tests/test_reporting_hierarchies_ddl.py'
      - 'tests/test_cash_flow_categories_ddl.py'
      - 'clickhouse/raw-schema.sql'
      - 'scripts/tb_only_first_build.py'
  pull_request:
    paths:
      - 'dbt_project/**'
      - 'scripts/check_gold_domains.py'
      - '.github/workflows/dbt-checks.yml'
      - 'clickhouse/init-db.sql'
      - 'tests/test_governed_chart_ddl.py'
      - 'tests/test_tb_only_first_build.py'
      - 'tests/test_raw_submission_ddl.py'
      - 'tests/test_fiscal_periods_ddl.py'
      - 'tests/test_deal_tables_ddl.py'
      - 'tests/test_reporting_hierarchies_ddl.py'
      - 'tests/test_cash_flow_categories_ddl.py'
      - 'clickhouse/raw-schema.sql'
      - 'scripts/tb_only_first_build.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gold-domain-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pyyaml
      - name: Every gold model has a known Build Governance domain
        run: python scripts/check_gold_domains.py dbt_project/dbt_project.yml

  dbt-parse:
    name: dbt project parses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # Pinned to what the running stack installs (docker/frappe/Dockerfile).
      - run: pip install "dbt-core==1.12.3" "dbt-clickhouse==1.9.3"
      # No connection needed: parse compiles the DAG without touching
      # ClickHouse, and profiles.yml's dev target defaults every env var.
      #
      # This is the check that was missing when the whole build silently
      # stopped producing models (#139): a Compilation Error — an enabled flag
      # disagreeing with a ref, a model renamed but still referenced, a stray
      # file with a space in its name — fails here instead of being discovered
      # on a live stack that had been stale for hours.
      - name: dbt parse
        run: >
          dbt parse --no-partial-parse
          --profiles-dir dbt_project --project-dir dbt_project

  contract-tests:
    name: warehouse contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # konsol#182: the governed chart's DDL is byte-identical to konsol's, and
      # silver and the guard read every one of its columns. Plain unittest, no
      # installs: nothing else in tests/ runs in CI.
      - name: governed chart DDL and column coverage
        run: python -m unittest -v tests.test_governed_chart_ddl
      # #191: the TB-only first build runs the cast test by name.
      - name: first-build script runs the cast test
        run: python -m unittest -v tests.test_tb_only_first_build
      # konsolidat#199: the TB submission control table's DDL is konsol's,
      # including amount_basis, and the CI fixture claims its batch by name.
      - name: raw submission control DDL and CI claim
        run: python -m unittest -v tests.test_raw_submission_ddl
      # konsolidat#199: the fiscal calendar's DDL is konsol's, it is a declared
      # dbt source, and the CI fixture seeds it with a Closing period.
      - name: fiscal calendar DDL, source and CI seed
        run: python -m unittest -v tests.test_fiscal_periods_ddl
      # konsolidat#198: the six deal tables and the group's policy/account
      # columns are konsol's DDL, verbatim, and declared dbt sources.
      - name: deal tables DDL and sources
        run: python -m unittest -v tests.test_deal_tables_ddl
      # konsol#220: reporting_hierarchies is konsol's DDL, verbatim, including
      # the dated member tranche columns, declared on the dbt source.
      - name: reporting hierarchies DDL and tranche columns
        run: python -m unittest -v tests.test_reporting_hierarchies_ddl
      # konsol#197: cash_flow_categories is konsol's DDL, verbatim, without the
      # `sign` column that nothing read.
      - name: cash flow categories DDL without the retired sign
        run: python -m unittest -v tests.test_cash_flow_categories_ddl

  tb-only-first-build:
    name: first build on a fresh TB-only site
    runs-on: ubuntu-latest
    # konsol#182: the canonical path is trial balances uploaded via CSV, so a
    # fresh site has no ERP rows and no ERP FX quotes.
    # `dbt parse` does not validate SQL; this builds the selection for real on
    # the empty init-db.sql + raw-schema.sql shape, then with a ZZ fixture.
    services:
      clickhouse:
        # Pinned to the running stack's major version (24.8).
        image: clickhouse/clickhouse-server:24.8
        env:
          CLICKHOUSE_PASSWORD: ci
        ports:
          - 8123:8123
        options: >-
          --health-cmd "wget -qO- http://localhost:8123/ping"
          --health-interval 5s --health-timeout 5s --health-retries 30
    env:
      CLICKHOUSE_HOST: localhost
      CLICKHOUSE_PORT: '8123'
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install "dbt-core==1.12.3" "dbt-clickhouse==1.9.3"
      - name: dbt build --select @silver_main_accounts (empty, then ZZ fixture)
        run: python scripts/tb_only_first_build.py --prefix ci_fb --fixture
