name: dbt checks

on:
  push:
    branches: [main]
    paths:
      - 'dbt_project/**'
      - 'scripts/check_gold_domains.py'
      - '.github/workflows/dbt-checks.yml'
      - 'clickhouse/init-db.sql'
      - 'tests/test_governed_chart_ddl.py'
      - 'tests/test_tb_only_first_build.py'
      - 'tests/test_raw_submission_ddl.py'
      - 'tests/test_fiscal_periods_ddl.py'
      - 'tests/test_deal_tables_ddl.py'
      - 'tests/test_reporting_hierarchies_ddl.py'
      - 'tests/test_cash_flow_categories_ddl.py'
      - 'clickhouse/raw-schema.sql'
      - 'scripts/tb_only_first_build.py'
      - 'scripts/ci_full_build.py'
      - 'tests/test_ci_full_build.py'
      - 'tests/integration/**'
      - 'scripts/report_subsections.py'
      - 'scripts/build_consolidation_report.py'
      - 'tests/test_report_subsections.py'
      - 'tests/test_gold_domain_coverage.py'
      # konsolidat#239 / #240: the guarded files themselves, so a later edit to
      # the deploy script or the image re-runs the test that guards it.
      - 'deploy.sh'
      - 'docker/frappe/Dockerfile'
      - 'tests/test_deploy_portability.py'
      - 'tests/test_restore_in_image.py'
  pull_request:
    paths:
      - 'dbt_project/**'
      - 'scripts/check_gold_domains.py'
      - '.github/workflows/dbt-checks.yml'
      - 'clickhouse/init-db.sql'
      - 'tests/test_governed_chart_ddl.py'
      - 'tests/test_tb_only_first_build.py'
      - 'tests/test_raw_submission_ddl.py'
      - 'tests/test_fiscal_periods_ddl.py'
      - 'tests/test_deal_tables_ddl.py'
      - 'tests/test_reporting_hierarchies_ddl.py'
      - 'tests/test_cash_flow_categories_ddl.py'
      - 'clickhouse/raw-schema.sql'
      - 'scripts/tb_only_first_build.py'
      - 'scripts/ci_full_build.py'
      - 'tests/test_ci_full_build.py'
      - 'tests/integration/**'
      - 'scripts/report_subsections.py'
      - 'scripts/build_consolidation_report.py'
      - 'tests/test_report_subsections.py'
      - 'tests/test_gold_domain_coverage.py'
      # konsolidat#239 / #240: the guarded files themselves, so a later edit to
      # the deploy script or the image re-runs the test that guards it.
      - 'deploy.sh'
      - 'docker/frappe/Dockerfile'
      - 'tests/test_deploy_portability.py'
      - 'tests/test_restore_in_image.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gold-domain-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pyyaml
      - name: Every gold model has a known Build Governance domain
        run: python scripts/check_gold_domains.py dbt_project/dbt_project.yml
      # The guard itself: it used to enumerate the YAML, so a model never
      # registered as a Build Model was invisible to it. Five had accumulated.
      - name: the gold-domain guard reads the directory, not only the YAML
        run: python -m unittest -v tests.test_gold_domain_coverage

  dbt-parse:
    name: dbt project parses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # Pinned to what the running stack installs (docker/frappe/Dockerfile).
      - run: pip install "dbt-core==1.12.3" "dbt-clickhouse==1.9.3"
      # No connection needed: parse compiles the DAG without touching
      # ClickHouse, and profiles.yml's dev target defaults every env var.
      #
      # This is the check that was missing when the whole build silently
      # stopped producing models (#139): a Compilation Error — an enabled flag
      # disagreeing with a ref, a model renamed but still referenced, a stray
      # file with a space in its name — fails here instead of being discovered
      # on a live stack that had been stale for hours.
      - name: dbt parse
        run: >
          dbt parse --no-partial-parse
          --profiles-dir dbt_project --project-dir dbt_project

  contract-tests:
    name: warehouse contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # konsol#182: the governed chart's DDL is byte-identical to konsol's, and
      # silver and the guard read every one of its columns. Plain unittest, no
      # installs: nothing else in tests/ runs in CI.
      - name: governed chart DDL and column coverage
        run: python -m unittest -v tests.test_governed_chart_ddl
      # #191: the TB-only first build runs the cast test by name.
      - name: first-build script runs the cast test
        run: python -m unittest -v tests.test_tb_only_first_build
      # konsolidat#199: the TB submission control table's DDL is konsol's,
      # including amount_basis, and the CI fixture claims its batch by name.
      - name: raw submission control DDL and CI claim
        run: python -m unittest -v tests.test_raw_submission_ddl
      # konsolidat#199: the fiscal calendar's DDL is konsol's, it is a declared
      # dbt source, and the CI fixture seeds it with a Closing period.
      - name: fiscal calendar DDL, source and CI seed
        run: python -m unittest -v tests.test_fiscal_periods_ddl
      # konsolidat#198: the six deal tables and the group's policy/account
      # columns are konsol's DDL, verbatim, and declared dbt sources.
      - name: deal tables DDL and sources
        run: python -m unittest -v tests.test_deal_tables_ddl
      # konsol#220: reporting_hierarchies is konsol's DDL, verbatim, including
      # the dated member tranche columns, declared on the dbt source.
      - name: reporting hierarchies DDL and tranche columns
        run: python -m unittest -v tests.test_reporting_hierarchies_ddl
      # konsol#197: cash_flow_categories is konsol's DDL, verbatim, without the
      # `sign` column that nothing read.
      - name: cash flow categories DDL without the retired sign
        run: python -m unittest -v tests.test_cash_flow_categories_ddl
      # konsolidat#181: the full-build job builds everything, guards the
      # zero-dimension case (konsolidat#220) and fails on a skipped test.
      - name: full-build job builds everything and fails on a skip
        run: python -m unittest -v tests.test_ci_full_build
      # konsolidat#185: the consolidation report takes its sub-sections from
      # the chart's declared sub_section, and names every account it had to
      # place by account-number prefix instead.
      - name: report sub-sections come from the chart, not the account number
        run: python -m unittest -v tests.test_report_subsections
      # konsolidat#239: `mktemp -t` needs three X's on GNU coreutils, so step 5
      # of deploy.sh — the dbt build — had never run on a Linux host. CI is
      # ubuntu, so the behavioural half of this test is real here.
      - name: deploy.sh creates its temp files portably
        run: python -m unittest -v tests.test_deploy_portability
      # konsolidat#240: frappe shells out to file(1) to detect a gzipped dump,
      # and the image did not install it, so bench restore could not run.
      - name: the image installs what bench restore shells out to
        run: python -m unittest -v tests.test_restore_in_image

  full-build:
    name: full build + assertions on a throwaway ClickHouse
    runs-on: ubuntu-latest
    # konsolidat#181. `dbt parse` does not validate SQL, and the scoped build
    # below is not the project: 375 nodes, 310 reachable from
    # @silver_main_accounts, 65 not — including eight singular assertions that
    # ran in no job at all, three of them the FX rate guards. tests/integration
    # never ran either: it skips itself when ClickHouse is unreachable, and no
    # job gave it one — and run for the first time it gave 7 failed, 30 passed,
    # 5 skipped, 3 errors.
    #
    # konsolidat#227 is now done and the suite is ON here. It is 10 tests, not
    # 30: 20 were deleted because they could not fail, duplicated this job, or
    # only asserted that the warehouse exists. What remains is the consolidation
    # arithmetic no other test can reach — an intercompany partner, ownership
    # below 100%, minority interest, equity method, a mid-year acquisition, a
    # disposal — none of which exists in live data or in the ZZ fixture, which
    # is why the thirteen assertions over gold_ic_* otherwise run on an empty
    # table. Measured green from a clean warehouse: full build PASS=320
    # ERROR=0 SKIP=0, suite 10 passed 0 skipped, zero-dimension build PASS=321.
    services:
      clickhouse:
        # Pinned to the running stack's major version (24.8).
        image: clickhouse/clickhouse-server:24.8
        env:
          CLICKHOUSE_PASSWORD: ci
        ports:
          - 8123:8123
        options: >-
          --health-cmd "wget -qO- http://localhost:8123/ping"
          --health-interval 5s --health-timeout 5s --health-retries 30
    env:
      CLICKHOUSE_HOST: localhost
      CLICKHOUSE_PORT: '8123'
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # pytest and requests are what tests/integration/conftest.py imports.
      - run: pip install "dbt-core==1.12.3" "dbt-clickhouse==1.9.3" pytest requests
      - name: full dbt build at real and zero dimensions, then the integration suite
        # A skip is a failure here (ci_full_build.py:135-139). That is why
        # tests/integration/test_frappe_sync.py had to go rather than be
        # repaired: it resolved konsol through KONSOL_APP_PATH, which was set
        # nowhere, and skipped all 7 of its tests on any machine without
        # ~/frappe-bench — so this runner could never have gone green with it in
        # place, whatever else was fixed.
        run: python scripts/ci_full_build.py --with-integration
      - name: upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-build-logs
          path: ci-logs/
          if-no-files-found: ignore

  tb-only-first-build:
    name: first build on a fresh TB-only site
    runs-on: ubuntu-latest
    # konsol#182: the canonical path is trial balances uploaded via CSV, so a
    # fresh site has no ERP rows and no ERP FX quotes.
    # `dbt parse` does not validate SQL; this builds the selection for real on
    # the empty init-db.sql + raw-schema.sql shape, then with a ZZ fixture.
    services:
      clickhouse:
        # Pinned to the running stack's major version (24.8).
        image: clickhouse/clickhouse-server:24.8
        env:
          CLICKHOUSE_PASSWORD: ci
        ports:
          - 8123:8123
        options: >-
          --health-cmd "wget -qO- http://localhost:8123/ping"
          --health-interval 5s --health-timeout 5s --health-retries 30
    env:
      CLICKHOUSE_HOST: localhost
      CLICKHOUSE_PORT: '8123'
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install "dbt-core==1.12.3" "dbt-clickhouse==1.9.3"
      - name: dbt build --select @silver_main_accounts (empty, then ZZ fixture)
        run: python scripts/tb_only_first_build.py --prefix ci_fb --fixture
