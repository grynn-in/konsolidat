name: deploy guards

# konsolidat#239 and #240. Both tests are pure Python over files in the repo:
# no ClickHouse, no dbt, no services, about two seconds. They live here rather
# than in `dbt checks` because that workflow's `paths` is workflow-level, so
# listing deploy.sh there dragged a full warehouse build and the TB-only first
# build onto every edit of the deploy script.
#
# The path list is what makes these guards real. test_deploy_portability scans
# EVERY shell script in the repo, not just deploy.sh, so every *.sh has to be a
# trigger; otherwise a bad `mktemp` in scripts/healthcheck.sh or
# docker/backup/backup.sh runs no job at all. The list is written out twice
# because GitHub Actions does not support YAML anchors — keep the two copies
# in step, as dbt-checks.yml also has to.
on:
  push:
    branches: [main]
    paths:
      - '**.sh'
      - 'docker/frappe/Dockerfile'
      - 'tests/test_deploy_portability.py'
      - 'tests/test_restore_in_image.py'
      - '.github/workflows/deploy-guards.yml'
  pull_request:
    paths:
      - '**.sh'
      - 'docker/frappe/Dockerfile'
      - 'tests/test_deploy_portability.py'
      - 'tests/test_restore_in_image.py'
      - '.github/workflows/deploy-guards.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guards:
    name: deploy script and image guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # konsolidat#239: `mktemp -t` needs three X's on GNU coreutils, so step 5
      # of deploy.sh — the dbt build — had never run on a Linux host. The runner
      # is ubuntu, so the behavioural half of this test executes here rather
      # than declaring the skip it must declare on a Mac.
      - name: deploy.sh creates its temp files portably
        run: python -m unittest -v tests.test_deploy_portability
      # konsolidat#240: frappe shells out to file(1) to detect a gzipped dump,
      # and the image did not install it, so bench restore could not run.
      - name: the image installs what bench restore shells out to
        run: python -m unittest -v tests.test_restore_in_image
