<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Open EPM</title>
  <link rel="stylesheet" href="taskpane.css" />
  <script src="https://appsforoffice.microsoft.com/lib/1.1/hosted/office.js"></script>
</head>
<body>
  <div id="app">
    <header>
      <h1>Open EPM</h1>
    </header>

    <!-- Login Section -->
    <section id="login-section">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="admin@example.com" autocomplete="username" />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Password" autocomplete="current-password" />
      </div>
      <button id="login-btn" class="btn btn-primary" onclick="login()">Log In</button>
      <div id="login-error" class="error" hidden></div>
    </section>

    <!-- Main Section (shown after login) -->
    <section id="main-section" hidden>
      <div class="user-bar">
        <span id="user-label"></span>
        <button class="btn btn-link" onclick="logout()">Log out</button>
      </div>

      <!-- Tab Bar -->
      <div class="tab-bar">
        <button class="tab active" data-tab="budget" onclick="switchTab('budget')">Budget</button>
        <button class="tab" data-tab="pipeline" onclick="switchTab('pipeline')">Pipeline</button>
      </div>

      <!-- Budget Tab -->
      <div id="tab-budget" class="tab-content active">
        <div id="sheet-info" class="card">
          <h2>Sheet Info</h2>
          <div class="field">
            <span class="label">Scenario</span>
            <span id="info-scenario">—</span>
          </div>
          <div class="field">
            <span class="label">Type</span>
            <span id="info-type">—</span>
          </div>
          <div class="field">
            <span class="label">Fiscal Year</span>
            <span id="info-year">—</span>
          </div>
          <div class="field">
            <span class="label">Layer</span>
            <span id="info-layer">—</span>
          </div>
          <div class="field">
            <span class="label">Entities</span>
            <span id="info-entities">—</span>
          </div>
          <div class="field">
            <span class="label">Data Rows</span>
            <span id="info-rows">—</span>
          </div>
        </div>

        <button class="btn btn-secondary" onclick="refreshSheet()">
          Refresh Actuals
        </button>
        <button class="btn btn-primary" onclick="saveBudget()">
          Save Sheet
        </button>
        <button class="btn btn-outline" onclick="saveBudgetAll()">
          Save All Sheets
        </button>

        <div id="budget-status" class="status-area" hidden></div>
        <div id="budget-error" class="error" hidden></div>
      </div>

      <!-- Pipeline Tab -->
      <div id="tab-pipeline" class="tab-content">
        <div id="status-card" class="card">
          <h2>Latest Pipeline Run</h2>
          <div id="no-runs" hidden>
            <p class="muted">No pipeline runs found.</p>
          </div>
          <div id="run-details" hidden>
            <div class="field">
              <span class="label">Status</span>
              <span id="run-status" class="badge"></span>
            </div>
            <div class="field">
              <span class="label">Started</span>
              <span id="run-started"></span>
            </div>
            <div class="field">
              <span class="label">Rows Synced</span>
              <span id="run-rows"></span>
            </div>
            <div class="field">
              <span class="label">dbt Result</span>
              <span id="run-dbt"></span>
            </div>
          </div>
        </div>

        <button id="run-btn" class="btn btn-primary" onclick="triggerPipeline()">
          Run Extract + dbt Build
        </button>
        <div id="run-error" class="error" hidden></div>

        <div id="polling-indicator" class="muted" hidden>
          Auto-refreshing every 5s&hellip;
        </div>
      </div>
    </section>

    <!-- Loading overlay -->
    <div id="loading" class="loading" hidden>
      <div class="spinner"></div>
    </div>
  </div>

  <script src="taskpane.js"></script>
</body>
</html>
