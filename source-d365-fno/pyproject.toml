[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "source-d365-fno"
version = "0.1.0"
description = "Airbyte source connector for Microsoft Dynamics 365 Finance & Operations"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "airbyte-cdk>=0.80",
    "requests>=2.31",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
source-d365-fno = "source_d365_fno.run:run"

[tool.setuptools.packages.find]
include = ["source_d365_fno*"]

[tool.setuptools.package-data]
source_d365_fno = ["spec.yaml", "schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["unit_tests"]
