# =============================================================================
# Second, independent stack next to the live demo (demo-ext.konsolidat.com)
# =============================================================================
# Approved by Deepak Pai, 7 Nov 2026, for the aquila-bike example. Same pattern
# as docker-compose.v16.yml: renames every fixed container name, moves the
# network to its own subnet, and keeps caddy and backup under profiles
# so they do not start. The live Caddy (project `konsolidat`) will later proxy
# demo-ext.konsolidat.com to FRAPPE_PORT (172.30.0.1:8169, the open_epm
# gateway on the host, so the port is not public).
#
#   cd /root/konsolidat-ext
#   docker compose -p konsolidat-ext --env-file .env \
#     -f docker-compose.yml -f docker-compose.ext.yml up -d --no-build
#
# The image is a tag of the live one: konsolidat-frappe:latest ->
# konsolidat-ext-frappe:latest (compose expects ${COMPOSE_PROJECT_NAME}-frappe).
# Never run deploy.sh here; never build here.
# =============================================================================

services:
  mariadb:
    container_name: konsolidat-ext_mariadb
  redis_cache:
    container_name: konsolidat-ext_redis_cache
  redis_queue:
    container_name: konsolidat-ext_redis_queue
  clickhouse:
    container_name: konsolidat-ext_clickhouse
    networks:
      default:
        ipv4_address: 172.31.0.10
  configurator:
    container_name: konsolidat-ext_configurator
  frappe_backend:
    container_name: konsolidat-ext_backend
  frappe_worker:
    container_name: konsolidat-ext_worker
  frappe_scheduler:
    container_name: konsolidat-ext_scheduler
  dbt_init:
    container_name: konsolidat-ext_dbt_init
  caddy:
    container_name: konsolidat-ext_caddy
    profiles:
      - caddy
  backup:
    container_name: konsolidat-ext_backup
    profiles:
      - backup

networks:
  default:
    name: open_epm_ext
    ipam:
      config:
        - subnet: 172.31.0.0/24
