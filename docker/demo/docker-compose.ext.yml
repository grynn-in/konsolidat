# =============================================================================
# Compose override so a second project can run beside another one.
# Renames every fixed container name, moves the network to its own subnet,
# and keeps caddy and backup under profiles so they do not start.
# Host, ports and credentials come from the operator's environment, not from here.
#
#   docker compose -p <project> --env-file .env \
#     -f docker-compose.yml -f docker-compose.ext.yml up -d --no-build
#
# The image is a tag of an already-built one (${COMPOSE_PROJECT_NAME}-frappe).
# Never run deploy.sh here; never build here.
# =============================================================================

services:
  mariadb:
    container_name: konsolidat-ext_mariadb
  redis_cache:
    container_name: konsolidat-ext_redis_cache
  redis_queue:
    container_name: konsolidat-ext_redis_queue
  clickhouse:
    container_name: konsolidat-ext_clickhouse
    networks:
      default:
        ipv4_address: 172.31.0.10
  configurator:
    container_name: konsolidat-ext_configurator
  frappe_backend:
    container_name: konsolidat-ext_backend
  frappe_worker:
    container_name: konsolidat-ext_worker
  frappe_scheduler:
    container_name: konsolidat-ext_scheduler
  dbt_init:
    container_name: konsolidat-ext_dbt_init
  caddy:
    container_name: konsolidat-ext_caddy
    profiles:
      - caddy
  backup:
    container_name: konsolidat-ext_backup
    profiles:
      - backup

networks:
  default:
    name: open_epm_ext
    ipam:
      config:
        - subnet: 172.31.0.0/24
