site_name: KNSLDT
site_url: https://konsolid.at/
site_description: Open-source Enterprise Performance Management for D365 F&O — consolidation, budgeting, allocations, and Excel-native reporting.
repo_url: https://github.com/grynn-in/konsolidat
repo_name: grynn-in/konsolidat

theme:
  name: material
  font: false
  icon:
    logo: material/consolidate
  palette:
    - scheme: default
      primary: white
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy

copyright: >
  MIT License &copy; 2024 <a href="https://github.com/grynn-in">grynn-in</a>.
  All rights reserved. Built with <a href="https://claude.ai">Claude Code</a>.

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/grynn-in/konsolidat
    - icon: fontawesome/solid/globe
      link: https://konsolid.at

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - tables
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
  - attr_list
  - md_in_html

