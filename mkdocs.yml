site_name: KNSLDT
site_url: https://konsolid.at/
site_description: Open-source Enterprise Performance Management for D365 F&O — consolidation, budgeting, allocations, and Excel-native reporting.
repo_url: https://github.com/grynn-in/konsolidat
repo_name: grynn-in/konsolidat

theme:
  name: material
  font: false
  icon:
    logo: material/consolidate
  palette:
    - scheme: default
      primary: white
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy

copyright: >
  MIT License &copy; 2024 <a href="https://github.com/grynn-in">grynn-in</a>.
  All rights reserved. Built with <a href="https://claude.ai">Claude Code</a>.

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/grynn-in/konsolidat
    - icon: fontawesome/solid/globe
      link: https://konsolid.at

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - tables
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
  - attr_list
  - md_in_html

nav:
  - Home: index.md
  - Why Konsolidat?:
      - Why Konsolidat?: why-konsolidat.md
      - Features: features.md
      - Cost Comparison: evaluation/cost-comparison-vs-commercial.md
      - Security Architecture: evaluation/security-architecture.md
      - Roadmap: reference/roadmap.md
  - Guides:
      - Getting Started:
          - Quickstart: getting-started/quickstart.md
          - Setup Guide: getting-started/setup-guide.md
          - Configuration: getting-started/configuration-reference.md
      - Excel:
          - VBA Add-in: user-guide/excel-vba-guide.md
          - Task Pane: user-guide/excel-taskpane-guide.md
      - Initial Setup: user-guide/initial-setup-guide.md
      - Financial Processes:
          - Consolidation: user-guide/consolidation-guide.md
          - Allocations: user-guide/allocation-guide.md
          - Budgeting: user-guide/budgeting-guide.md
          - Budget Layers: user-guide/budget-layers.md
          - Variance Analysis: user-guide/variance-analysis-guide.md
      - Reports:
